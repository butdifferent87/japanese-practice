<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일본어 연습 아카이브</title>
<style>
  :root {
    --bg: #FAFAF8;
    --card: #FFFFFF;
    --text: #1A1A1A;
    --muted: #5C7066;
    --accent: #007050;
    --accent-soft: rgba(0,112,80,.10);
    --stroke: rgba(0,0,0,.08);
    --shadow: 0 4px 14px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1A1A;
      --card: #232323;
      --text: #FDFCF8;
      --muted: #9AA9A2;
      --accent: #35B98D;
      --accent-soft: rgba(53,185,141,.14);
      --stroke: rgba(255,255,255,.09);
      --shadow: 0 4px 18px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.6;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--stroke);
    padding: 12px 20px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  header .count { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  button {
    font: inherit; font-size: 13px; font-weight: 600;
    border: 1px solid var(--stroke); background: var(--card); color: var(--text);
    padding: 7px 13px; border-radius: 999px; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  main { max-width: 860px; margin: 0 auto; padding: 24px 20px 80px; }

  /* ---- 목록 ---- */
  .grid { display: grid; gap: 12px; }
  .item {
    display: grid; grid-template-columns: 152px 1fr; gap: 14px;
    background: var(--card); border: 1px solid var(--stroke); border-radius: 14px;
    padding: 12px; cursor: pointer; box-shadow: var(--shadow);
    transition: transform .12s, border-color .12s;
  }
  .item:hover { transform: translateY(-2px); border-color: var(--accent); }
  .item img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 9px; display: block; background: var(--accent-soft); }
  .item h2 { margin: 2px 0 5px; font-size: 15px; font-weight: 700; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .meta span + span::before { content: "·"; margin: 0 6px; }
  .item p { margin: 7px 0 0; font-size: 13px; color: var(--muted); }
  @media (max-width: 560px) { .item { grid-template-columns: 1fr; } }

  /* ---- 상세 ---- */
  .back { margin-bottom: 16px; }
  .detail h2 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; }
  /* 플레이어는 폭을 제한한다 — 전폭이면 자막이 화면 밖으로 밀림 */
  .video, .noembed { max-width: 560px; }
  .video { aspect-ratio: 16/9; width: 100%; border: 0; border-radius: 14px; margin: 16px 0 6px; background: #000; }

  /* 임베드 차단 영상 폴백 */
  .noembed {
    position: relative; display: block; margin: 16px 0 6px;
    border-radius: 14px; overflow: hidden; border: 1px solid var(--stroke);
    text-decoration: none; color: #fff;
  }
  .noembed img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; filter: brightness(.55); }
  .noembed .ov {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 20px;
  }
  .noembed .play {
    width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,.92);
    display: grid; place-items: center; color: #C00; font-size: 21px; padding-left: 4px;
  }
  .noembed b { font-size: 15px; }
  .noembed small { font-size: 12.5px; opacity: .85; max-width: 420px; }
  .noembed:hover img { filter: brightness(.4); }

  .hint { font-size: 12.5px; color: var(--muted); margin: 0 0 22px; }
  .cue { border-left: 3px solid var(--accent-soft); padding: 2px 0 2px 14px; margin: 0 0 18px; }
  .cue:hover { border-left-color: var(--accent); }
  .ts {
    font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--accent); background: var(--accent-soft);
    border: 0; padding: 4px 8px; border-radius: 6px; cursor: pointer; margin-bottom: 7px;
  }
  .jp { font-size: 16.5px; margin: 0 0 5px; }
  .kr { font-size: 14px; color: var(--muted); margin: 0; }

  /* 후리가나 — 끄면 rt 를 숨긴다 (텍스트는 그대로) */
  ruby rt { font-size: .5em; color: var(--muted); font-weight: 400; }
  body.no-furi ruby rt { display: none; }
  /* 후리가나 켤 때 줄간격 확보 */
  body:not(.no-furi) .jp { line-height: 2.1; }

  /* ---- 회화 노트 ---- */
  /* 칩 줄: 헤더 아래 고정 · 한 줄로 가로 스와이프 (top 은 JS 가 헤더 높이로 맞춘다) */
  .jump { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; margin: 12px -20px 8px;
    padding: 8px 20px; position: sticky; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--stroke); scrollbar-width: none; }
  .jump::-webkit-scrollbar { display: none; }
  .jump button { flex: 0 0 auto; }
  .call-panel > h3.call-sec[id] { display: none; }   /* 칩이 곧 제목이라 겹치는 제목은 숨긴다 */
  .call-panel { min-height: 60vh; }
  .call-sec { margin: 30px 0 12px; font-size: 16.5px; scroll-margin-top: 96px; }
  .fix { background: var(--card); border: 1px solid var(--stroke); border-radius: 11px;
    padding: 11px 13px; margin: 0 0 10px; }
  .fix .jp { margin: 2px 0 0; }
  .fix .said { color: var(--muted); text-decoration: line-through;
    text-decoration-color: rgba(210,70,70,.55); }
  .fix .nat { font-weight: 600; }
  .fix .why { font-size: 13px; color: var(--muted); margin: 5px 0 0; }
  .fix .kr { margin-top: 3px; }
  .fix-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tsx { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; font-weight: 600;
    background: var(--accent-soft); color: var(--accent); }
  .tag.rep { background: rgba(230,150,0,.14); color: #B26A00; }
  .patterns { margin: 0; padding-left: 20px; }
  .patterns li { margin: 0 0 7px; font-size: 14.5px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
  .stat { background: var(--card); border: 1px solid var(--stroke); border-radius: 11px;
    padding: 10px 12px; font-size: 13px; }
  .stat b { display: block; font-size: 17px; }
  .stat small { color: var(--muted); }
  .fix .lbl { font-size: 11.5px; color: var(--muted); margin: 8px 0 0; font-weight: 600; }
  .fix .wanted { font-size: 14px; margin: 2px 0 0; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
  .key { font-size: 13px; background: var(--accent-soft); border-radius: 999px; padding: 3px 11px; }
  .key b { font-size: 14.5px; margin-right: 3px; }
  body:not(.no-furi) .key b { line-height: 1.9; }
  .fix .said-full { color: var(--muted); }
  /* 🧱 카드: 실제로 한 말을 조각별로 판정 (✅ 맞음 · 🔸 어색 · ❌ 틀림) */
  .parts { list-style: none; padding: 0; margin: 6px 0 2px; }
  .parts li { display: grid; grid-template-columns: 20px 1fr; column-gap: 6px; padding: 6px 0;
    border-top: 1px dashed var(--stroke); }
  .parts .pv { font-size: 13px; line-height: 1.9; }
  .parts .jp { font-size: 14.5px; margin: 0; }
  .parts .p-bad .jp { text-decoration: underline wavy rgba(210,70,70,.75); text-underline-offset: 5px; }
  .parts .pw { grid-column: 2; font-size: 13px; color: var(--muted); margin-top: 1px; }
  .fix .bad { text-decoration: underline wavy rgba(210,70,70,.75); text-underline-offset: 5px; color: var(--text); }
  .fix .good { background: var(--accent-soft); border-radius: 5px; padding: 0 2px; }
  .fix .ctx { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  .fix .ctx .jp { font-size: 14px; }
  .fix .ctx-kr { display: block; font-size: 12.5px; }
  .clip-btn { padding: 3px 10px; font-size: 12px; }
  .clip-btn:disabled { opacity: .45; cursor: default; }
  .fix .playable:not(.clip-btn) { cursor: pointer; }
  .fix .playable:not(.clip-btn):hover { background: var(--accent-soft); border-radius: 6px; }
  .fix .ctx .clip-btn { padding: 1px 8px; margin-right: 4px; vertical-align: middle; }
  .fix-top .chk { margin-left: auto; }
  /* 카드 오른쪽 위: ★ 별표 + ✓ 확인 */
  .fix-top .tools { margin-left: auto; display: flex; gap: 6px; }
  .fix-top .tools .chk { margin-left: 0; }
  .star { flex: none; width: 26px; height: 26px; padding: 0; border-radius: 8px; display: grid; place-items: center;
    font-size: 14px; line-height: 1; color: var(--muted); background: var(--card); }
  .star.on { background: #F2B01E; border-color: #F2B01E; color: #fff; }
  .starall { display: block; width: 100%; margin: 0 0 12px; padding: 11px 14px; font-weight: 700; text-align: left; }
  .star-grp { font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 14px 0 6px; }
  .star-call-h { font-size: 15px; margin: 18px 0 2px; }
  .vocabcard .fix-top b.jp { font-size: 18px; }
  .vocabcard .mn { margin: 4px 0 0; }
  /* 안 한 것 / 확인한 것 / 전체 */
  .filt { display: inline-flex; gap: 0; margin: 10px 0 2px; border: 1px solid var(--stroke); border-radius: 999px; overflow: hidden; }
  .filt button { border: 0; border-radius: 0; padding: 6px 13px; font-size: 13px; background: var(--card); }
  .filt button + button { border-left: 1px solid var(--stroke); }
  .filt button.on { background: var(--accent); color: #fff; }
  .detail.f-todo .call-panel .fix.done { display: none; }
  .detail.f-done .call-panel .fix:not(.done) { display: none; }
  /* 확인한 카드는 한 줄로 접힌다(누르면 펼침) */
  .fix.done:not(.open) > :not(.fix-top):not(.peek) { display: none; }
  .fix.done:not(.open) > .peek { margin-top: 4px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body:not(.no-furi) .fix.done:not(.open) > .peek rt { display: none; }
  .fix.done:not(.open) { cursor: pointer; }
  .fix.done { opacity: .5; }
  .fix.done:hover { opacity: 1; }
  /* 후리가나가 한자보다 길 때 한자 사이가 벌어지지 않게 (예: 状況 → 「状  況」) */
  ruby { ruby-align: center; }
  .fix.playing { border-color: var(--accent); }
  .fix.playing .clip-btn { background: var(--accent); color: #fff; border-color: var(--accent); }
  .lock { max-width: 340px; margin: 48px auto; text-align: center; }
  .lock p { color: var(--muted); font-size: 14px; }
  .lock input[type=password] { font: inherit; font-size: 24px; letter-spacing: .35em; text-align: center;
    width: 100%; padding: 10px; margin: 10px 0 4px; border-radius: 11px;
    border: 1px solid var(--stroke); background: var(--card); color: var(--text); }
  .lock label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 14px; }
  .lock .err { color: #D14545; font-size: 13px; min-height: 1.4em; }

  /* 번역 가리기 */
  body.hide-kr .kr { filter: blur(5px); opacity: .55; cursor: pointer; }
  body.hide-kr .kr.reveal { filter: none; opacity: 1; }

  /* 구간 재생 */
  .cue.has-audio .jp { cursor: pointer; }
  .cue.has-audio .jp:hover { background: var(--accent-soft); border-radius: 7px;
    box-shadow: 0 0 0 6px var(--accent-soft); }
  .cue.playing { position: relative; }
  .cue.playing .jp { background: var(--accent-soft); border-radius: 7px;
    box-shadow: 0 0 0 6px var(--accent-soft); }
  .cue.playing .ts { background: var(--accent); color: #fff; }
  .pl { border: 0; background: none; cursor: pointer; font-size: 13px; padding: 2px 5px;
    color: var(--muted); border-radius: 6px; margin-left: 2px; }
  .pl:hover { background: var(--accent-soft); color: var(--accent); }
  .cue.playing .pl { color: var(--accent); }
  .noaudio { font-size: 12.5px; color: var(--muted); }

  h3 { font-size: 15px; margin: 34px 0 12px; padding-bottom: 7px; border-bottom: 1px solid var(--stroke); }
  .notes { display: grid; gap: 9px; }
  .note { background: var(--card); border: 1px solid var(--stroke); border-radius: 11px; padding: 11px 13px; }
  .note b { font-size: 15.5px; }
  .note .rd { color: var(--muted); font-size: 12.5px; margin-left: 6px; }
  .note .mn { font-size: 14px; margin: 3px 0 0; }
  .note .pt { font-size: 12.5px; color: var(--muted); margin: 4px 0 0; }
  .extra { background: var(--accent-soft); border-radius: 11px; padding: 12px 14px; font-size: 13.5px; margin-top: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }

  /* ---- 코너 ---- */
  .corners { display: flex; gap: 6px; }
  .item.plain { grid-template-columns: 1fr; }
  .search {
    font: inherit; font-size: 14px; width: 100%;
    background: var(--card); color: var(--text);
    border: 1px solid var(--stroke); border-radius: 11px;
    padding: 10px 13px; margin-bottom: 14px;
  }
  .search:focus { outline: none; border-color: var(--accent); }
  /* 꼭지 통번역 — 문장마다가 아니라 한 덩어리로 한 번 보여준다 */
  .itemkr { font-size: 14px; color: var(--muted); background: var(--card);
    border: 1px solid var(--stroke); border-radius: 11px; padding: 12px 14px; margin: 0 0 22px; }
  body.hide-kr .itemkr { filter: blur(5px); opacity: .55; cursor: pointer; }
  body.hide-kr .itemkr.reveal { filter: none; opacity: 1; }
  .krbar { margin: 0 0 6px; }
  .blockplay { font-size: 12px; padding: 3px 10px; color: var(--muted); }
  .blockplay.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  body:not(.hide-kr) .itemkr { cursor: pointer; }
  .warn { font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--accent);
    padding: 6px 0 6px 12px; margin: 0 0 18px; }

  /* ---- 문장 쪼개기 (NHK) ---- */
  .segs { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-bottom: 5px; }
  .seg .pl {
    border: 1px solid var(--stroke); background: var(--card); color: var(--muted);
    min-width: 28px; padding: 3px 8px; border-radius: 7px; font-size: 12px; margin: 0;
  }
  .seg .pl:hover { border-color: var(--accent); color: var(--accent); }
  .seg.playing .pl { background: var(--accent); color: #fff; border-color: var(--accent); }
  .join {
    font-size: 11px; padding: 3px 6px; margin: 0 -1px; border-radius: 6px;
    color: var(--muted); background: transparent; border-color: transparent;
    letter-spacing: -1px;
  }
  .join:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .edit { font-size: 12px; padding: 3px 9px; color: var(--muted); }
  .edit.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .editor {
    background: var(--card); border: 1px solid var(--stroke); border-radius: 11px;
    padding: 12px 14px; margin: 8px 0 10px;
  }
  .editor .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .editor .row + .row { margin-top: 10px; }
  .editor input[type=range] { flex: 1; min-width: 220px; accent-color: var(--accent); }
  .editor .t {
    font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--accent); background: var(--accent-soft);
    padding: 4px 7px; border-radius: 6px; min-width: 56px; text-align: center;
  }
  .editor .tip { font-size: 12px; color: var(--muted); margin: 9px 0 0; }

  /* 편집 중에는 글자를 짚어 끊을 지점을 고른다 */
  .cue.editing .jp { cursor: default; }
  .tok { border-radius: 4px; padding: 1px 0; }
  .tok:hover { background: var(--accent-soft); box-shadow: -3px 0 0 var(--accent); cursor: pointer; }
  .tok.at { background: var(--accent-soft); box-shadow: -3px 0 0 var(--accent); }
  /* 이미 나눈 경계는 글자 사이에 선으로 보인다 */
  .tok.cutmark { box-shadow: -3px 0 0 var(--accent); }

  /* ---- 단어장 ---- */
  #savePop {
    /* fixed 로 둔다 — 스크롤해도 화면 안에 그대로 있어야 누를 수 있다 */
    position: fixed; z-index: 40; transform: translate(-50%, 0);
    background: var(--accent); color: #fff; border: 0; border-radius: 999px;
    font: 600 12.5px/1 inherit; padding: 8px 13px; cursor: pointer;
    box-shadow: var(--shadow); white-space: nowrap;
  }
  #savePop[hidden] { display: none; }
  .vocab { display: grid; gap: 10px; }
  .word {
    background: var(--card); border: 1px solid var(--stroke); border-radius: 12px;
    padding: 12px 14px; box-shadow: var(--shadow);
  }
  .word .hd { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .word .w { font-size: 18px; font-weight: 700; }
  .word .r { font-size: 13px; color: var(--accent); }
  .word .ctx { font-size: 13.5px; color: var(--muted); margin: 7px 0 0; line-height: 1.9; }
  .word .ctx b { color: var(--text); background: var(--accent-soft); border-radius: 4px; padding: 0 2px; }
  .word .foot { display: flex; align-items: center; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
  .word .foot .lbl { font-size: 12px; color: var(--muted); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .word button { font-size: 12px; padding: 4px 10px; }

  /* ★ 어려운 문장 표시 */
  .hard { font-size: 13px; padding: 3px 9px; color: var(--muted); line-height: 1; }
  .hard.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .hardcard .jp { font-size: 16px; margin: 8px 0 0; }
  .hardcard .segs { margin-bottom: 0; }

  /* ---- 완료 체크 ---- */
  .rowtop { display: flex; align-items: flex-start; gap: 10px; }
  .rowtop h2 { flex: 1; min-width: 0; }
  .chk {
    flex: none; width: 26px; height: 26px; padding: 0; border-radius: 8px;
    display: grid; place-items: center; font-size: 14px; line-height: 1;
    color: var(--muted); background: var(--card);
  }
  .chk.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .item.done { opacity: .62; }
  .item.done h2 { text-decoration: line-through; text-decoration-thickness: 1px; }
  .item.done:hover { opacity: 1; }
  /* 상세 화면의 완료 버튼 */
  .donebar { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; }
  .donebar .note-sm { font-size: 12.5px; color: var(--muted); }

  /* ---- 동기화 패널 ---- */
  #syncPanel {
    position: fixed; inset: 0; z-index: 20; padding: 20px;
    background: rgba(0,0,0,.55); display: grid; place-items: center;
  }
  #syncPanel[hidden] { display: none; }
  .sync-card {
    background: var(--card); border: 1px solid var(--stroke); border-radius: 16px;
    padding: 20px; max-width: 520px; width: 100%; box-shadow: var(--shadow);
    max-height: 90vh; overflow: auto;
  }
  .sync-card h3 { margin: 0 0 10px; border: 0; padding: 0; font-size: 17px; }
  .sync-card p { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
  .sync-auto { background: var(--accent-soft); border-radius: 11px; padding: 12px 14px; margin-bottom: 4px; }
  .sync-auto .sync-row:last-of-type { margin-bottom: 0; }
  .autostate { font-size: 14px; }
  .sync-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .note-sm { font-size: 12.5px; color: var(--muted); }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 30;
    background: var(--accent); color: #fff; font-size: 13.5px; font-weight: 600;
    padding: 10px 16px; border-radius: 999px; box-shadow: var(--shadow);
  }
  #syncIn { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    resize: vertical; }
</style>
</head>
<body>
<header>

        <b>NHK 교재 관련은 올라가지 않는다</b>(폰엔 교재가 없어 못 쓰고, 기기 밖으로 내보내지 않는다).</p>

      안 되면 메모·메시지로 자신에게 보내도 된다.</p>

<main id="app"></main>

<script src="data.js"></script>
<!-- NHK 코너는 로컬에만 있다. 상용 교재라 공개 배포물에서는 deploy.sh 가 이 줄을 지운다. -->
<!-- 회화 노트: 평문 calls.js 는 로컬에만 있다(deploy.sh 가 이 줄을 지운다).
     공개본에는 잠금본 calls.enc.js 만 올라가고, 브라우저에서 암호로 푼다. -->
<script src="calls.enc.js"></script>
<script>
const app = document.getElementById('app');

// ---- 저장소 (사본 1벌) ----
// 저장할 때마다 `<키>.bak` 에도 같은 내용을 쓴다. 본 키가 지워졌는데 사본이 남아 있으면
// 읽을 때 자동으로 되돌린다. 실제로 한 번 날린 적이 있어서 넣었다.
// (브라우저 데이터를 통째로 지우면 둘 다 사라진다 — 그건 이걸로 못 막는다.)
function loadStore(key) {
  const read = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const main = read(key);
  if (main && Object.keys(main).length) return main;
  const bak = read(key + '.bak');
  if (bak && Object.keys(bak).length) {
    localStorage.setItem(key, JSON.stringify(bak));
    setTimeout(() => toast('저장본이 비어 있어 사본에서 되살렸다'), 400);
    return bak;
  }
  return main || {};
}
function saveStore(key, val) {
  const s = JSON.stringify(val);
  localStorage.setItem(key, s);
  localStorage.setItem(key + '.bak', s);
}

/** 탭이 여러 개면 각자 메모리에 사본을 들고 있다. 그대로 덮어쓰면 늦게 저장한 탭이
 *  다른 탭의 변경을 지운다. 저장 직전에 디스크 내용과 합쳐서 그걸 막는다.
 *  pick(a, b) 는 같은 항목이 양쪽에 있을 때 무엇을 남길지 정한다. */
function mergeWithDisk(key, mem, pick) {
  let disk = {};
  try { disk = JSON.parse(localStorage.getItem(key)) || {}; } catch { disk = {}; }
  const out = { ...disk };
  for (const [k, v] of Object.entries(mem)) {
    out[k] = k in disk ? pick(disk[k], v) : v;
  }
  return out;
}
// 완료·단어장은 값에 시각이 들어 있어 최신이 이긴다. 삭제도 음수 시각이라 같은 규칙.
const newerTs = (a, b) => (Math.abs(b?.t ?? b) >= Math.abs(a?.t ?? a) ? b : a);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// t 는 소수점 초(63.7 등)일 수 있다. 표시·유튜브 점프는 정수 초로 내린다.
const mmss = t => Math.floor(t/60) + ':' + String(Math.floor(t%60)).padStart(2,'0');

// {漢字|かんじ} → <ruby>漢字<rt>かんじ</rt></ruby>
// rt 는 CSS 로 숨기므로, 후리가나를 꺼도 본문 글자는 그대로 남는다.
const ruby = s => esc(s).replace(/\{([^|{}]+)\|([^|{}]+)\}/g,
  (_, base, rd) => `<ruby>${base}<rt>${rd}</rt></ruby>`);

// ---- 완료 표시 ----
// 정적 사이트라 서버가 없다 → localStorage. 주소·기기마다 따로 쌓인다는 뜻이다
// (맥 로컬과 폰의 공개본은 서로 모른다).
// 키는 인덱스가 아니라 문자열 id 를 쓴다 — 데이터를 다시 임포트하면 순번이 밀려서
// 인덱스로 잡아둔 완료 표시가 엉뚱한 꼭지로 옮겨간다.
// 값은 불린이 아니라 **시각**이다: 양수 = 그때 완료, 음수 = 그때 완료 해제.
// 기기 간 병합에 필요하다 — 어느 쪽이 최신인지 알아야 "한쪽에서 지운 것"과
// "다른 쪽에서 아직 안 받은 것"을 구분할 수 있다. 불린이면 구분이 불가능해
// 합칠 때마다 지운 게 되살아난다.
const DONE_KEY = 'done.v1';
let doneMap = loadStore(DONE_KEY);
const doneOf = kind => (doneMap[kind] ||= {});
const isDone = (kind, id) => (doneOf(kind)[id] || 0) > 0;
function saveDone() {
  scheduleCloudPush();
  // doneMap 은 {kind: {id: 시각}} 두 겹이라 안쪽 맵까지 합친다.
  doneMap = mergeWithDisk(DONE_KEY, doneMap,
    (disk, mem) => mergeWithDisk_inner(disk, mem));
  saveStore(DONE_KEY, doneMap);
}
function mergeWithDisk_inner(disk, mem) {
  const out = { ...disk };
  for (const [id, ts] of Object.entries(mem)) {
    out[id] = id in disk ? (Math.abs(ts) >= Math.abs(disk[id]) ? ts : disk[id]) : ts;
  }
  return out;
}
function setDone(kind, id, on) {
  doneOf(kind)[id] = on ? Date.now() : -Date.now();
  saveDone();
}
const doneCount = (kind, ids) => ids.reduce((n, id) => n + (isDone(kind, id) ? 1 : 0), 0);

// ---- 단어장 ----
// 모르는 표현을 드래그해 모아둔다. 값은 완료 표시와 같은 규칙으로 시각을 쓴다
// (양수=보유, 음수=삭제). 기기 간 병합이 되게 하려면 삭제도 시각으로 남겨야 한다.
const VOCAB_KEY = 'vocab.v1';
let vocabMap = loadStore(VOCAB_KEY);
function saveVocab() {
  scheduleCloudPush();
  vocabMap = mergeWithDisk(VOCAB_KEY, vocabMap, newerTs);
  saveStore(VOCAB_KEY, vocabMap);
}
const vocabKey = (w, s) => w + '␟' + s;        // 같은 단어라도 나온 문장이 다르면 별개
const vocabList = () => Object.entries(vocabMap)
  .filter(([, v]) => v.t > 0)
  .sort((a, b) => b[1].t - a[1].t)
  .map(([k, v]) => ({ key: k, ...v }));

function addVocab(entry) {
  const key = vocabKey(entry.w, entry.s);
  if (vocabMap[key] && vocabMap[key].t > 0) return false;   // 이미 있음
  vocabMap[key] = { ...entry, t: Date.now() };
  saveVocab();
  return true;
}
function removeVocab(key) {
  if (!vocabMap[key]) return;
  vocabMap[key] = { ...vocabMap[key], t: -Date.now() };      // 무덤을 남긴다 — 동기화 때 부활 방지
  saveVocab();
}

/** 선택 영역에서 표면형과 읽기를 뽑는다. 후리가나(rt)가 섞여 들어오는 걸 막아야 한다. */
function selectionInfo() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) return null;
  const range = sel.getRangeAt(0);
  const node = range.commonAncestorContainer;
  const el = node.nodeType === 1 ? node : node.parentElement;
  const jp = el?.closest?.('.jp');
  if (!jp) return null;

  const frag = range.cloneContents();
  const surf = document.createElement('div');
  surf.appendChild(frag.cloneNode(true));
  surf.querySelectorAll('rt').forEach(e => e.remove());
  const w = surf.textContent.replace(/\s+/g, '').trim();
  if (!w) return null;

  // 읽기: ruby 를 그 rt 로 바꾼다 → 한자 부분이 가나로 펴진다
  const rd = document.createElement('div');
  rd.appendChild(frag.cloneNode(true));
  rd.querySelectorAll('ruby').forEach(r => {
    const rt = r.querySelector('rt');
    r.replaceWith(document.createTextNode(rt ? rt.textContent : r.textContent));
  });
  const r = rd.textContent.replace(/\s+/g, '').trim();

  return { w, r: r === w ? '' : r, jp, rect: range.getBoundingClientRect() };
}

// ---- 어려운 문장 ----
// 문장 단위 표시. 완료(꼭지 단위)와는 별개다 — 꼭지는 끝냈어도 그 안의 특정 문장만
// 계속 안 잡히는 일이 흔하고, 그 문장들만 다시 도는 게 듣기 훈련의 핵심이라서.
// 값 규칙은 다른 저장소와 같다(양수=표시, 음수=해제) — 기기 간 병합에 필요하다.
const HARD_KEY = 'hard.v1';
let hardMap = loadStore(HARD_KEY);
function saveHard() {
  scheduleCloudPush();
  hardMap = mergeWithDisk(HARD_KEY, hardMap, newerTs);
  saveStore(HARD_KEY, hardMap);
}
const hardKey = e => `${e.kind}:${e.ref}:${e.start ?? 0}`;
const isHard = k => (hardMap[k] || {}).t > 0;
const hardList = () => Object.entries(hardMap)
  .filter(([, v]) => v.t > 0).sort((a, b) => b[1].t - a[1].t)
  .map(([k, v]) => ({ key: k, ...v }));

function toggleHard(entry) {
  const k = hardKey(entry);
  hardMap[k] = isHard(k) ? { ...hardMap[k], t: -Date.now() } : { ...entry, t: Date.now() };
  saveHard();
  return isHard(k);
}

// 목록에서 바로 들을 수 있어야 의미가 있다. 재생에 필요한 것만 저장해 자족적으로 만든다.
//   NHK  — kind:'nhk', ref: 파일명            (파일 하나가 곧 그 문장)
//   유튜브 — kind:'yt',  ref: 영상 id, start/end (한 파일 안의 구간)
function hardEntryOfCue(cue) {
  const file = cue.dataset.file;
  if (file) {
    return { kind: 'nhk', ref: file, start: 0, end: null,
             jp: cue.dataset.jp || '', label: currentLabel(), h: location.hash || '#' };
  }
  return { kind: 'yt', ref: (location.hash.slice(1) || ''), 
           start: +cue.dataset.start || 0, end: cue.dataset.end ? +cue.dataset.end : null,
           jp: cue.dataset.jp || '', label: currentLabel(), h: location.hash || '#' };
}

const hardBtnHtml = (entry) =>
  `<button class="hard${isHard(hardKey(entry)) ? ' on' : ''}" title="어려운 문장으로 표시">★</button>`;

// ---- 기기 간 자동 동기화 ----
// 맥과 폰이 같은 상태를 보게 한다. 계정 로그인 대신 비밀키 하나로 가른다 —
// 키를 아는 기기끼리만 같은 칸을 읽고 쓴다.
//
// ⚠️ 교재(NHK) 파생 데이터는 **올리지 않는다.** 폰에는 교재가 없어 어차피 못 쓰고,
// 상용 교재를 기기 밖으로 내보내지 않는다는 이 프로젝트의 규칙과도 맞다.
// 그래서 올라가는 건 유튜브 노트 진도·거기서 담은 단어·어려운 문장뿐이다.
const SYNC_URL = 'https://jp-sync.hikaro-world.workers.dev';
const SYNC_KEY_NAME = 'sync.key';
const syncKey = () => localStorage.getItem(SYNC_KEY_NAME) || '';

// 원문을 클라우드로 내보내면 안 되는 출처.
//   #nhk   — 상용 교재
//   #calls — 실제 통화. 상대방이 있는 사생활 대화다.
// 단어장은 '단어만' 올리는 예외를 두지만(아래), 문장·라벨은 어느 쪽도 올리지 않는다.
const isPrivateSource = entry =>
  /^#(nhk|calls)/.test(entry?.h || '') || entry?.kind === 'nhk' || entry?.kind === 'calls';

/** 같은 단어를 두 기기가 같은 것으로 알아보게 하는 지문. 원문을 복원할 수는 없다. */
async function vocabFingerprint(w, sentence) {
  const buf = new TextEncoder().encode(`${w}\u241f${sentence || ''}`);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return 'v' + [...new Uint8Array(hash)].slice(0, 10).map(b => b.toString(16).padStart(2, '0')).join('');
}

/**
 * 폰에서 쓸 수 있는 것만 남긴다.
 *
 * 단어장은 예외를 뒀다 — 교재에서 담은 단어라도 **단어와 읽기 자체는 사전 표제어**라
 * 폰에서 복습할 값어치가 있다. 대신 그 단어가 나온 **교재 문장은 빼고** 올리고,
 * 키도 지문(해시)으로 바꿔 문장이 키에 묻어 나가지 않게 한다.
 * 어려운 문장과 꼭지 완료는 문장·목차 그 자체라 계속 제외한다.
 */
async function cloudPayload() {
  const v = {};
  for (const [k, e] of Object.entries(vocabMap)) {
    if (!isPrivateSource(e)) { v[k] = e; continue; }
    const fp = await vocabFingerprint(e.w, e.s);
    v[fp] = { w: e.w, r: e.r || '', t: e.t };     // 문장·출처 라벨은 올리지 않는다
  }
  const h = Object.fromEntries(Object.entries(hardMap || {}).filter(([, e]) => !isPrivateSource(e)));
  // 회화 노트의 ✓·★ 는 id 만 저장한다(`<통화id>:<구분>:<순번>`) — 본문이 없어 올려도 안전하고,
  // 폰에서도 같은 노트를 보므로 맞춰져야 한다.
  return {
    d: { yt: doneMap.yt || {}, callsItem: doneMap.callsItem || {}, callsStar: doneMap.callsStar || {} },
    v, h,
  };
}

/** 받은 단어가 이미 이 기기에 있는 것인지 지문으로 대조한다(중복 생성 방지). */
async function localFingerprints() {
  const map = new Map();
  for (const [k, e] of Object.entries(vocabMap)) {
    map.set(await vocabFingerprint(e.w, e.s), k);
  }
  return map;
}

let pushTimer = 0, syncing = false, pushPending = false;

// 체크하고 바로 탭을 닫거나 폰을 잠그면 1.5초 대기 중이던 올리기가 날아간다.
// 화면이 숨겨지는 순간 남은 것을 즉시 보낸다. keepalive 를 붙여 창이 닫혀도 전송이 끝난다.
addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'hidden' || !pushPending || !syncKey()) return;
  clearTimeout(pushTimer);
  pushPending = false;
  try {
    cloudPayload().then(body => {
      fetch(SYNC_URL, {
        method: 'PUT',
        headers: { 'content-type': 'application/json', 'x-sync-key': syncKey() },
        body: JSON.stringify(body),
        keepalive: true,
      }).catch(() => {});
    });
  } catch { /* 닫히는 중이면 더 할 수 있는 게 없다 */ }
});
function scheduleCloudPush() {
  if (!syncKey()) return;
  pushPending = true;
  clearTimeout(pushTimer);
  // 체크를 연달아 누르는 동안 매번 올리지 않는다.
  pushTimer = setTimeout(pushCloud, 1500);
}

async function pushCloud() {
  if (!syncKey() || syncing) return;
  try {
    await fetch(SYNC_URL, {
      method: 'PUT',
      headers: { 'content-type': 'application/json', 'x-sync-key': syncKey() },
      body: JSON.stringify(await cloudPayload()),
    });
    pushPending = false;
    localStorage.setItem('sync.last', String(Date.now()));
  } catch { /* 네트워크가 없으면 다음 변경 때 다시 올린다 */ }
}

async function pullCloud(loud) {
  if (!syncKey()) return 0;
  syncing = true;
  try {
    const r = await fetch(SYNC_URL, { headers: { 'x-sync-key': syncKey() } });
    if (!r.ok) throw new Error(r.status);
    const incoming = await r.json();
    // 받은 것도 한 번 더 거른다 — 클라우드에 교재 데이터가 있더라도 로컬을 덮지 못하게.
    const safe = {
      d: {
        yt: incoming?.d?.yt || {},
        callsItem: incoming?.d?.callsItem || {},
        callsStar: incoming?.d?.callsStar || {},
      },
      v: Object.fromEntries(Object.entries(incoming?.v || {}).filter(([, e]) => !isPrivateSource(e))),
      h: Object.fromEntries(Object.entries(incoming?.h || {}).filter(([, e]) => !isPrivateSource(e))),
    };
    // 지문으로 온 단어가 이미 있는 것이면, 새로 만들지 말고 기존 항목의 시각만 맞춘다.
    const fps = await localFingerprints();
    for (const [k, e] of Object.entries(safe.v)) {
      const local = fps.get(k);
      if (local && Math.abs(e.t) > Math.abs(vocabMap[local].t)) {
        vocabMap[local] = { ...vocabMap[local], t: e.t };
        delete safe.v[k];
      } else if (local) {
        delete safe.v[k];
      }
    }
    const n = mergeState(safe);
    if (n) { route(); }
    if (loud) toast(n ? `동기화 — ${n}개 반영됨` : '동기화 — 이미 최신');
    return n;
  } catch {
    if (loud) toast('동기화 실패 — 인터넷을 확인해라');
    return 0;
  } finally {
    syncing = false;
  }
}

// ---- 기기 간 동기화 (수동) ----
// 서버가 없으니 상태를 코드로 만들어 손으로 옮긴다. 아이폰↔맥은 유니버설
// 클립보드가 붙여넣기까지 알아서 넘겨준다.
//
// 병합은 **항목별로 시각이 큰 쪽**을 고른다. 그래서 방향이 상관없고, 같은 코드를
// 두 번 넣어도 결과가 같다. 한쪽에서만 체크한 것은 그대로 살아남는다.
const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64d = s => Uint8Array.from(
  atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));

async function exportState() {
  // {d: 완료, v: 단어장}. 옛 코드가 만든 코드는 d 가 없는 통짜 객체라 받는 쪽에서 갈라 읽는다.
  const json = new TextEncoder().encode(JSON.stringify({ d: doneMap, v: vocabMap, h: hardMap }));
  // 완료가 쌓이면 코드가 길어진다. 압축이 있으면 쓰고, 없으면 그냥 보낸다.
  if (typeof CompressionStream === 'undefined') return 'r' + b64e(json);
  const cs = new CompressionStream('deflate-raw');
  const w = cs.writable.getWriter(); w.write(json); w.close();
  return 'z' + b64e(await new Response(cs.readable).arrayBuffer());
}

async function decodeState(code) {
  const body = code.trim().replace(/^.*#sync=/, '');
  const bytes = b64d(body.slice(1));
  if (body[0] === 'r') return JSON.parse(new TextDecoder().decode(bytes));
  const ds = new DecompressionStream('deflate-raw');
  const w = ds.writable.getWriter(); w.write(bytes); w.close();
  return JSON.parse(new TextDecoder().decode(await new Response(ds.readable).arrayBuffer()));
}

function mergeState(incoming) {
  // 옛 형식(통짜 완료 맵)과 새 형식({d, v}) 을 모두 받는다.
  const done = incoming && incoming.d ? incoming.d : (incoming && !incoming.v ? incoming : {});
  const voc = (incoming && incoming.v) || {};

  let changed = 0;
  for (const kind of Object.keys(done)) {
    const mine = doneOf(kind), theirs = done[kind] || {};
    for (const [id, ts] of Object.entries(theirs)) {
      if (typeof ts !== 'number') continue;
      const cur = mine[id] || 0;
      if (Math.abs(ts) > Math.abs(cur)) { mine[id] = ts; changed++; }
    }
  }
  if (changed) saveDone();

  let hChanged = 0;
  for (const [key, entry] of Object.entries((incoming && incoming.h) || {})) {
    if (!entry || typeof entry.t !== 'number') continue;
    const cur = hardMap[key];
    if (!cur || Math.abs(entry.t) > Math.abs(cur.t)) { hardMap[key] = entry; hChanged++; }
  }
  if (hChanged) saveHard();

  let vChanged = 0;
  for (const [key, entry] of Object.entries(voc)) {
    if (!entry || typeof entry.t !== 'number') continue;
    const cur = vocabMap[key];
    if (!cur || Math.abs(entry.t) > Math.abs(cur.t)) { vocabMap[key] = entry; vChanged++; }
  }
  if (vChanged) saveVocab();

  return changed + vChanged + hChanged;
}

async function syncLink() {
  // 코드를 해시 조각에 싣는다 — 해시는 서버로 전송되지 않는다.
  const base = location.origin + location.pathname;
  return `${base}#sync=${await exportState()}`;
}

const checkBtn = (kind, id) =>
  `<button class="chk${isDone(kind, id) ? ' on' : ''}" data-kind="${kind}" data-done-id="${esc(id)}"
     title="완료 표시">✓</button>`;

// 목록의 체크 버튼은 카드 클릭(=상세 진입)과 겹치므로 전파를 끊는다.
function wireChecks(root, onChange) {
  root.querySelectorAll('.chk').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const { kind, doneId } = btn.dataset;
      const next = !isDone(kind, doneId);
      setDone(kind, doneId, next);
      btn.classList.toggle('on', next);
      btn.closest('.item, .fix')?.classList.toggle('done', next);
      onChange && onChange();
    };
  });
}

// ---- 토글 (설정은 localStorage 에 기억) ----
function setupToggle(btnId, cls, key, onLabel, offLabel, defaultOn) {
  const btn = document.getElementById(btnId);
  const saved = localStorage.getItem(key);
  const on = saved === null ? defaultOn : saved === '1';
  document.body.classList.toggle(cls, !on);
  const sync = () => {
    const isOn = !document.body.classList.contains(cls);
    btn.classList.toggle('on', isOn);
    btn.textContent = isOn ? onLabel : offLabel;
  };
  btn.onclick = () => {
    document.body.classList.toggle(cls);
    localStorage.setItem(key, document.body.classList.contains(cls) ? '0' : '1');
    sync();
  };
  sync();
}
setupToggle('toggleFuri', 'no-furi', 'furi', '후리가나 켬', '후리가나 끔', true);
setupToggle('toggleKr', 'hide-kr', 'kr', '번역 보임', '번역 가림', true);
setupToggle('toggleLoop', 'no-loop', 'loop', '반복 켬', '반복 끔', false);
const loopOn = () => !document.body.classList.contains('no-loop');

// ---- 구간 오디오 재생 ----
// raw/audio/<id>.m4a 가 있으면 대사를 눌러 그 구간만 듣는다.
// 파일을 지우면 재생 버튼이 자동으로 사라진다 (듣기 마스터 후 정리용).
const audio = new Audio();
audio.preload = 'metadata';
let curCue = null, stopAt = null;

audio.addEventListener('timeupdate', () => {
  if (stopAt === null || audio.currentTime < stopAt) return;
  if (loopOn() && curCue) { audio.currentTime = +curCue.dataset.start; return; }
  stopSeg();
});
audio.addEventListener('ended', () => {
  if (seq.on) { seqNext(); return; }          // 꼭지 이어 듣기 중이면 다음 문장으로
  // 문장마다 파일이 따로인 코너에서는 파일 끝 = 구간 끝이라 timeupdate 가 안 잡는다.
  if (loopOn() && curCue) {
    audio.currentTime = +curCue.dataset.start || 0;
    audio.play().catch(stopSeg);
    return;
  }
  stopSeg();
});

// ---- 꼭지 전체 이어 듣기 ----
// 문장마다 파일이 따로라 한 번에 재생할 수 없다. 끝나는 대로 다음 파일로 넘긴다.
// 조각 분할은 무시하고 문장 통째로 흘린다 — 통으로 듣는 게 이 기능의 목적이다.
const seq = { on: false, list: [], i: 0, advancing: false, btn: null };

function seqStop() {
  seq.on = false;
  seq.list = [];
  seq.btn = null;
  stopSeg();
  syncSeqButton();
}

function seqNext() {
  seq.i += 1;
  if (seq.i >= seq.list.length) {
    if (loopOn() && seq.list.length) { seq.i = 0; } else { seqStop(); return; }
  }
  seqPlayCurrent();
}

function seqPlayCurrent() {
  const cue = seq.list[seq.i];
  if (!cue || !document.body.contains(cue)) { seqStop(); return; }
  seq.advancing = true;
  playSeg(cue);
  seq.advancing = false;
  cue.scrollIntoView({ block: 'center', behavior: 'smooth' });
  syncSeqButton();
}

function seqStart(list, btn) {
  list = (list && list.length) ? list : [...app.querySelectorAll('.cue.has-audio')];
  if (!list.length) return;
  seq.on = true;
  seq.list = list;
  seq.btn = btn || document.getElementById('playAll');
  seq.i = 0;
  seqPlayCurrent();
}

function syncSeqButton() {
  // 이어 듣기 트리거가 둘이다 — 꼭지 전체 버튼과 문단별 버튼. 지금 도는 쪽만 상태를 바꾼다.
  const main = document.getElementById('playAll');
  if (main) {
    const mine = seq.on && seq.btn === main;
    main.classList.toggle('on', mine);
    main.textContent = mine ? `■ 정지 (${seq.i + 1}/${seq.list.length})` : '▶ 꼭지 전체 듣기';
  }
  document.querySelectorAll('.blockplay').forEach(b => {
    const mine = seq.on && seq.btn === b;
    b.classList.toggle('on', mine);
    b.textContent = mine ? `■ ${seq.i + 1}/${seq.list.length}` : '▶ 문단';
  });
}

// 재생 버튼은 ▶/■ 로 바뀌는데, 조각 버튼은 라벨이 숫자(1·2·3)라 그대로 덮으면 사라진다.
// 처음 바꿀 때 원래 라벨을 적어두고 되돌린다.
function plOf(el) { return el.querySelector(':scope > .pl') || el.querySelector('.pl'); }
function markPlaying(el, on) {
  el.classList.toggle('playing', on);
  const btn = plOf(el);
  if (!btn) return;
  if (on) {
    if (btn.dataset.label === undefined) btn.dataset.label = btn.textContent;
    btn.textContent = '■';
  } else {
    btn.textContent = btn.dataset.label ?? '▶';
  }
}

// timeupdate 는 250ms 간격으로만 뛴다 — 그걸로 구간 끝을 잡으면 최대 0.25초가 다음 조각으로
// 넘어간다. 짧은 조각에선 그 꼬리가 그대로 오답이 되므로 별도로 촘촘히 본다.
let segWatch = 0;
function watchCutoff() {
  clearInterval(segWatch);
  segWatch = setInterval(() => {
    if (!curCue || stopAt === null || audio.paused) return;
    if (audio.currentTime < stopAt) return;
    if (loopOn()) { audio.currentTime = +curCue.dataset.start || 0; return; }
    stopSeg();
  }, 25);
}

function stopSeg() {
  clearInterval(segWatch);
  audio.pause();
  stopAt = null;
  if (curCue) markPlaying(curCue, false);
  curCue = null;
}

// 두 가지 음성 구조를 다 받는다:
//   유튜브 노트 — 영상당 파일 하나 + 구간 오프셋(data-start/end)
//   NHK 코너   — 문장마다 파일 하나(data-src), 파일 전체가 곧 그 문장
function playSeg(cue) {
  // 이어 듣기 중에 사용자가 다른 문장을 누르면 이어 듣기를 끝낸다.
  // (다음 문장으로 넘기느라 내부에서 부른 경우는 seq.advancing 으로 구분한다.)
  if (seq.on && !seq.advancing) { seq.on = false; seq.list = []; syncSeqButton(); }
  if (curCue === cue) { stopSeg(); return; }   // 같은 구간 다시 누르면 정지
  stopSeg();
  curCue = cue;
  const ownSrc = cue.dataset.src || '';
  // end 가 있으면 거기서 끊는다. 없으면(=NHK 통문장) 파일 끝까지 — ended 가 맡는다.
  const end = cue.dataset.end;
  stopAt = end !== undefined && end !== '' ? +end : null;
  markPlaying(cue, true);
  // 메타데이터가 아직이면 currentTime 세팅이 무시돼 0초부터 재생된다. 로드를 기다린다.
  const go = () => {
    if (curCue !== cue) return;               // 기다리는 사이 다른 구간을 눌렀으면 버림
    audio.currentTime = +cue.dataset.start || 0;
    audio.play().then(watchCutoff).catch(() => stopSeg());
  };
  if (ownSrc && !audio.src.endsWith(ownSrc)) {
    audio.src = ownSrc;                       // 소스가 바뀌면 readyState 가 0 으로 돌아간다
    audio.addEventListener('loadedmetadata', go, { once: true });
    return;
  }
  audio.readyState >= 1 ? go() : audio.addEventListener('loadedmetadata', go, { once: true });
}

          <button class="ts" data-t="${c.t}">${mmss(c.t)}</button><button class="pl" title="이 구간만 듣기">▶</button>${hardBtnHtml({ kind: 'yt', ref: v.id, start: c.t })}
          <p class="jp">${ruby(c.jp)}</p>

// ---- NHK 코너 (로컬 전용) ----
// nhk.js 가 없으면(=공개 배포본) 탭 자체가 안 뜬다.
// 옛 형식(꼭지에 kr·cues 가 바로 달린 형태)도 받아준다 — 캐시된 데이터로 화면이
// 통째로 죽는 것보다는 낫다.
const normalizeNhk = items => items.map(it =>
  it.blocks ? it : { group: it.group, blocks: [{ kr: it.kr || '', cues: it.cues || [] }] });

let NHK = typeof NHK_ITEMS !== 'undefined' ? normalizeNhk(NHK_ITEMS) : [];
const cueCount = it => it.blocks.reduce((n, b) => n + b.cues.length, 0);

// nhk.js 는 임포트를 다시 돌릴 때마다 바뀌는데 브라우저가 이를 캐시한다.
// 옛 데이터를 조용히 쓰는 사고가 나므로 매번 새로 받아 덮는다.
// (교재가 없는 빌드에서는 script 태그 자체가 없으므로 이 함수도 호출되지 않는다.)
async function reloadNhk() {
  const res = await fetch('nhk.js?v=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error(res.status);
  const txt = await res.text();
  return normalizeNhk(JSON.parse(txt.slice(txt.indexOf('['), txt.lastIndexOf(';'))));
}
let nhkQuery = '';
let hideDone = localStorage.getItem('hideDone') === '1';

function renderNhkList() {
  const q = nhkQuery.trim();
  let hits = NHK.map((it, i) => [it, i]);
  if (q) hits = hits.filter(([it]) =>
    it.group.includes(q) ||
    it.blocks.some(b => b.kr.includes(q) ||
      b.cues.some(c => c.jp.replace(/\{([^|{}]+)\|[^|{}]+\}/g, '$1').includes(q))));
  if (hideDone) hits = hits.filter(([it]) => !isDone('nhk', it.group));

  app.innerHTML = `
    <p class="warn">상용 교재(《NHK 뉴스 3단계 집중전략》) 산출물이라 이 코너는 이 맥에서만 열린다.
      공개 사이트에는 올라가지 않는다.</p>
    <input class="search" id="nhkQ" placeholder="꼭지 제목·일본어·번역 검색" value="${esc(q)}">
    <div class="donebar" style="margin:0 0 14px">
      <button id="hideDone" class="${hideDone ? 'on' : ''}">미완료만</button>
      <span class="note-sm">${hits.length}꼭지 표시 중</span>
    </div>
    ${hits.length ? '<div class="grid">' + hits.map(([it, i]) => `
      <div class="item plain${isDone('nhk', it.group) ? ' done' : ''}" data-i="${i}">
        <div>
          <div class="rowtop"><h2>${esc(it.group)}</h2>${checkBtn('nhk', it.group)}</div>
          <div class="meta"><span>문장 ${cueCount(it)}개</span><span>문단 ${it.blocks.length}개</span></div>
          <p>${esc(it.blocks[0].kr.slice(0, 90))}${it.blocks[0].kr.length > 90 ? '…' : ''}</p>
        </div>
      </div>`).join('') + '</div>'
      : `<p class="empty">${hideDone && !q ? '전부 완료했다. 👏' : '검색 결과 없음.'}</p>`}`;

  document.getElementById('hideDone').onclick = () => {
    hideDone = !hideDone;
    localStorage.setItem('hideDone', hideDone ? '1' : '0');
    renderNhkList();
  };
  wireChecks(app, () => updateCount('nhk'));

  const input = document.getElementById('nhkQ');
  input.oninput = () => {
    nhkQuery = input.value;
    const at = input.selectionStart;
    renderNhkList();
    const next = document.getElementById('nhkQ');
    next.focus();
    next.setSelectionRange(at, at);
  };
  app.querySelectorAll('.item').forEach(el =>
    el.onclick = () => { location.hash = 'nhk/' + el.dataset.i; });
}

// ---- 문장 쪼개기 ----
// 음성 파일은 건드리지 않는다. "몇 초에서 끊어 들을지"만 기록하고 재생 구간을 나눈다.
// 그래서 되돌리기가 공짜고, 원본이 상하지 않는다.
// NHK 전용 — 이 코너는 문장마다 파일이 따로라 파일명이 곧 문장 id 다.
const SPLIT_KEY = 'splits.v1';
let splitMap = loadStore(SPLIT_KEY);
// 분할은 {t: 초, i: 그 앞에서 끊은 글자 번호}. 시간만 저장하면 "어디서 잘렸나"를
// 글자 위에 표시하려고 매번 시간→글자 역산을 해야 하고, 그 역산은 음성 분석이 필요하다.
// 자를 때 글자 번호를 같이 적어두면 표시가 공짜다.
const splitsOf = file => (splitMap[file] || []).map(s => (typeof s === 'number' ? { t: s, i: null } : s));
const splitTimes = file => splitsOf(file).map(s => s.t);
function saveSplits() {
  // 분할은 시각이 없다. 한 번에 한 문장만 고치므로, 이 탭이 만진 문장은 이 탭 값을 쓰고
  // 나머지는 디스크 값을 그대로 둔다.
  splitMap = mergeWithDisk(SPLIT_KEY, splitMap, (disk, mem) => mem);
  saveStore(SPLIT_KEY, splitMap);
}
function addSplit(file, t, i = null) {
  const at = Math.round(t * 100) / 100;
  const cur = splitsOf(file);
  // 0.15초 안쪽으로 겹치는 지점은 같은 자리로 본다 — 두 번 눌러 조각이 생기는 걸 막는다.
  if (at <= 0.05 || cur.some(s => Math.abs(s.t - at) < 0.15)) return false;
  splitMap[file] = cur.concat({ t: at, i }).sort((a, b) => a.t - b.t);
  saveSplits();
  return true;
}
/** 경계 하나를 지운다 = 그 양옆 조각이 도로 하나가 된다. */
function removeSplitAt(file, idx) {
  const cur = splitsOf(file);
  if (idx < 0 || idx >= cur.length) return false;
  cur.splice(idx, 1);
  // 키를 지우면 안 된다. 저장할 때 디스크 내용과 합치는데, '없어짐'은 합치기로
  // 전달되지 않아 지운 경계가 되살아난다. 빈 배열을 남겨 '나눈 곳 없음'을 명시한다.
  splitMap[file] = cur;
  saveSplits();
  return true;
}

function clearSplits(file) {
  if (!splitsOf(file).length) return false;
  splitMap[file] = [];
  saveSplits();
  return true;
}

function undoSplit(file) {
  const cur = splitsOf(file);
  if (!cur.length) return false;
  cur.pop();
  splitMap[file] = cur;
  saveSplits();
  return true;
}

const secs = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}.${Math.floor((t % 1) * 10)}`;

// ---- 글자별 실측 시각 ----
// nhk_align.py 가 음성을 인식해 원문 글자마다 시각을 붙여둔 결과.
// 모라 비례는 문장 안에서 말이 고르게 흐른다고 가정하는데 실제로는 그렇지 않아
// (실측 0.33초까지 어긋났다) 이 파일이 있으면 그쪽을 쓴다. 없으면 추정으로 돌아간다.
let NHK_TIMES = null;
(async () => {
  if (!NHK.length) return;
  try {
    const r = await fetch('nhk_times.json?v=' + Date.now(), { cache: 'no-store' });
    if (r.ok) NHK_TIMES = await r.json();
  } catch { /* 없으면 추정으로 간다 */ }
})();

// ---- 음량 포락선 ----
// 20ms 단위 RMS. 두 군데 쓴다: ① 말이 실제로 시작·끝나는 지점 ② 자를 자리를 붙일 무음 골짜기.
// 한 파일당 한 번만 계산하고 캐시한다.
const envCache = new Map();
async function analyzeAudio(src) {
  if (envCache.has(src)) return envCache.get(src);
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const raw = await (await fetch(src)).arrayBuffer();
  const ctx = new Ctx();
  const buf = await ctx.decodeAudioData(raw);
  ctx.close();

  const data = buf.getChannelData(0);
  const hop = 0.02;
  const frame = Math.round(buf.sampleRate * hop);
  const rms = [];
  for (let i = 0; i + frame <= data.length; i += frame) {
    let s = 0;
    for (let j = 0; j < frame; j++) { const v = data[i + j]; s += v * v; }
    rms.push(Math.sqrt(s / frame));
  }
  // 최대 음량의 6% 를 말/무음 경계로 본다. 교재 음성은 잡음이 적어 이 정도로 갈린다.
  const thresh = Math.max(...rms) * 0.06;
  let a = 0, b = rms.length - 1;
  while (a < rms.length && rms[a] < thresh) a++;
  while (b > a && rms[b] < thresh) b--;

  const env = { rms, hop, peak: Math.max(...rms), speechStart: a * hop, speechEnd: (b + 1) * hop, duration: buf.duration };
  envCache.set(src, env);
  return env;
}

// ---- 글자 위치 → 시간 추정 ----
// 교재 음성엔 단어별 타임스탬프가 없다(유튜브 노트와 달리 STT 를 안 돌렸다).
// 대신 일본어가 모라 박자 언어라는 성질을 쓴다 — 모라 수에 비례해 시간을 나눈다.
// 후리가나가 데이터에 들어 있어 한자의 모라 수도 셀 수 있다.
// ⚠️ 이건 추정이다. 정확한 경계가 필요하면 커서를 옮겨 미세 조정한다.
const SMALL_KANA = 'ゃゅょャュョぁぃぅぇぉァィゥェォ';
const isKana = c => /[ぁ-ゖァ-ヺーｦ-ﾟ]/.test(c);
const isKanji = c => /[一-鿿々〆〇]/.test(c);
const moraOf = s => [...s].filter(c => !SMALL_KANA.includes(c)).length;

// 구두점은 소리가 없는 대신 **쉼**이 된다. 모라로 환산해 얹지 않으면 추정이 앞으로 밀린다.
const PAUSE = { '、': 1.5, '，': 1.5, '。': 2.5, '？': 2.5, '！': 2.5, '・': 0.5 };

/** 글자를 항상 조각 단위로 그린다. 편집을 안 켜도 어디서 잘렸는지 보여야 하기 때문. */
function jpHtml(jp, file) {
  const { tokens } = tokenize(jp);
  const cut = new Set(splitsOf(file).map(s => s.i).filter(i => i !== null));
  return tokens.map((tk, i) =>
    `<span class="tok${cut.has(i) ? ' cutmark' : ''}" data-i="${i}">${tk.read
      ? `<ruby>${esc(tk.text)}<rt>${esc(tk.read)}</rt></ruby>`
      : esc(tk.text)}</span>`).join('');
}

/** {漢字|かんじ} 마크업 문장 → 클릭 단위 토큰 배열. cum = 그 토큰 **앞**까지의 누적 모라. */
function tokenize(jp) {
  const out = [];
  let cum = 0;
  let ci = 0;   // 마크업을 걷어낸 원문에서 이 토큰이 시작하는 글자 번호 (정렬 결과와 맞추는 열쇠)
  const re = /\{([^|{}]+)\|([^|{}]+)\}|([\s\S])/g;
  let m;
  while ((m = re.exec(jp)) !== null) {
    const [, base, read, ch] = m;
    if (base !== undefined) {
      out.push({ text: base, read, cum, ci });
      cum += moraOf(read);
      ci += base.length;
    } else {
      // 숫자·라틴 문자를 0 으로 세면 안 된다. 뉴스 문장의 31% 에 숫자가 들어 있고,
      // 일본어로 읽으면 글자당 여러 모라가 된다(2 = に, 5 = ご, A = エー).
      // 정확한 읽기는 문맥마다 다르므로 평균치로 둔다.
      const w = PAUSE[ch] !== undefined ? PAUSE[ch]
              : isKana(ch) ? (SMALL_KANA.includes(ch) ? 0 : 1)
              : isKanji(ch) ? 2
              : /[0-9０-９]/.test(ch) ? 2
              : /[A-Za-zＡ-Ｚａ-ｚ]/.test(ch) ? 2
              : 0;
      out.push({ text: ch, cum, ci });
      cum += w;
      ci += 1;
    }
  }
  // 문장 끝 구두점에는 쉼 시간을 얹지 않는다. 음성이 문장 단위로 잘려 있어 뒤에
  // 쉼이 실제로 없기 때문 — 얹으면 전체 길이가 부풀어 추정이 통째로 어긋난다.
  const last = out[out.length - 1];
  if (last && PAUSE[last.text] !== undefined) cum -= PAUSE[last.text];

  return { tokens: out, total: cum || 1 };
}

// 조각 버튼들. 마지막 조각은 end 를 비워 파일 끝까지 재생한다(길이를 몰라도 된다).
function segsHtml(file) {
  const cuts = splitTimes(file);
  const src = 'raw/nhk/' + file;
  if (!cuts.length) {
    return `<span class="seg" data-src="${esc(src)}" data-start="0"><button class="pl" title="이 문장 듣기">▶</button></span>`;
  }
  const bounds = [0, ...cuts];
  return bounds.map((start, n) => {
    const end = n < cuts.length ? cuts[n] : '';
    const seg = `<span class="seg" data-src="${esc(src)}" data-start="${start}" data-end="${end}">
      <button class="pl" title="${secs(start)}부터">${n + 1}</button></span>`;
    // 조각과 조각 사이에 그 경계를 없애는 버튼을 둔다 — 어느 경계를 붙일지 고를 수 있어야 한다.
    const join = n < cuts.length
      ? `<button class="join" data-cut="${n}" title="${secs(cuts[n])} 경계를 없애 ${n + 1}·${n + 2} 를 합친다">⇥⇤</button>`
      : '';
    return seg + join;
  }).join('');
}

function renderNhkDetail(it, i) {
  stopSeg();
  app.innerHTML = `
    <button class="back">← NHK 목록</button>
    <div class="detail">
      <h2>${esc(it.group)}</h2>
      <div class="meta"><span>문장 ${cueCount(it)}개</span><span>문단 ${it.blocks.length}개</span><span>${i + 1} / ${NHK.length}</span></div>
      <div class="donebar" style="margin:14px 0 4px">
        <button id="playAll">▶ 꼭지 전체 듣기</button>
        <span class="note-sm">문장을 이어서 재생한다. 「반복」을 켜면 꼭지를 통째로 되풀이한다.</span>
      </div>
      <p class="hint"><b>일본어 문장을 누르면 그 문장만 재생.</b>
        번역이 가려져 있으면 클릭해서 확인.</p>
      ${it.blocks.map(b => `
        <div class="block">
          <div class="krbar"><button class="blockplay" title="이 문단의 일본어를 이어서 듣는다">▶ 문단</button></div>
          <p class="itemkr">${esc(b.kr)}</p>
          ${b.cues.map(c => `
            <div class="cue${c.src ? ' has-audio' : ''}" data-file="${esc(c.src || '')}"
                 data-src="${esc(c.src ? 'raw/nhk/' + c.src : '')}" data-start="0"
                 data-jp="${esc(c.jp)}">
              ${c.src ? `<div class="segs">${segsHtml(c.src)}
                <button class="edit" title="이 문장을 원하는 지점에서 끊는다">✂ 편집</button>
                ${hardBtnHtml({ kind: 'nhk', ref: c.src, start: 0 })}
              </div>` : ''}
              <p class="jp">${jpHtml(c.jp, c.src)}</p>
            </div>`).join('')}
        </div>`).join('')}
      ${doneBar('nhk', it.group, '이 꼭지 완료로 표시')}
    </div>`;

  wireDoneBar('nhk', it.group, '이 꼭지 완료로 표시');
  const playAll = document.getElementById('playAll');
  playAll.onclick = () => { seq.on ? seqStop() : seqStart(); };
  syncSeqButton();
  app.querySelector('.back').onclick = () => { location.hash = 'nhk'; };
  // 한국어 문단 = 그 아래 일본어 문장 여러 개를 묶는 단위. 그 범위만 이어서 듣게 한다.
  const cuesOfBlock = block => [...block.querySelectorAll('.cue.has-audio')];
  app.querySelectorAll('.block').forEach(block => {
    const btn = block.querySelector('.blockplay');
    if (btn) btn.onclick = () => {
      if (seq.on && seq.btn === btn) { seqStop(); return; }
      seqStop();
      seqStart(cuesOfBlock(block), btn);
    };
    const kr = block.querySelector('.itemkr');
    if (!kr) return;
    kr.onclick = () => {
      // 번역이 가려져 있으면 먼저 여는 게 우선이다. 이미 보이면 그 범위를 듣는다.
      if (document.body.classList.contains('hide-kr') && !kr.classList.contains('reveal')) {
        kr.classList.add('reveal');
        return;
      }
      if (seq.on && seq.btn === btn) { seqStop(); return; }
      seqStop();
      seqStart(cuesOfBlock(block), btn);
    };
  });
  app.querySelectorAll('.cue.has-audio').forEach(wireCue);
}

function wireCue(cue) {
  const file = cue.dataset.file;
  cue.querySelectorAll('.seg').forEach(seg => {
    seg.querySelector('.pl').onclick = () => playSeg(seg);
  });
  cue.querySelectorAll('.join').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      if (!removeSplitAt(file, +btn.dataset.cut)) return;
      const open = cue.querySelector('.editor');
      repaintSegs(cue, file);
      if (!open) cue.querySelector('.edit')?.classList.remove('on');
      toast('경계를 없앴다');
    };
  });
  // 글자를 누르면 문장 전체. 안 나눈 문장은 그 조각이 곧 전체다.
  cue.querySelector('.jp').onclick = () => {
    const segs = cue.querySelectorAll('.seg');
    playSeg(segs.length === 1 ? segs[0] : cue);
  };
  const edit = cue.querySelector('.edit');
  if (edit) edit.onclick = () => toggleEditor(cue, file, edit);
  wireHard(cue);
}

/** ★ 버튼. 눌린 상태는 저장소에서 읽으므로 화면을 다시 그려도 유지된다. */
function wireHard(cue) {
  const btn = cue.querySelector('.hard');
  if (!btn) return;
  btn.onclick = (e) => {
    e.stopPropagation();
    const on = toggleHard(hardEntryOfCue(cue));
    btn.classList.toggle('on', on);
    toast(on ? '어려운 문장에 추가' : '어려운 문장에서 뺌');
  };
}

// 조각과 글자 표시를 함께 다시 그린다 — 자른 자리가 글자 위에도 나타나야 한다.
function repaintSegs(cue, file) {
  stopSeg();
  cue.querySelector('.segs').innerHTML =
    segsHtml(file) + '<button class="edit on" title="이 문장을 원하는 지점에서 끊는다">✂ 편집</button>';
  cue.querySelector('.jp').innerHTML = jpHtml(cue.dataset.jp || '', file);
  wireCue(cue);
  const edit = cue.querySelector('.edit');
  edit.classList.add('on');
  edit.onclick = () => toggleEditor(cue, file, edit);
}

// 패널을 없앨 때는 반드시 이걸 쓴다. 편집 중엔 글자를 토큰으로 갈아끼워 뒀기 때문에
// 그냥 remove 하면 문장이 토큰 상태로 남는다.
function closeEditor(el) {
  if (!el) return;
  el.restoreJp?.();
  el.stopPreview?.();
  el.remove();
}

function toggleEditor(cue, file, btn) {
  const open = cue.querySelector('.editor');
  if (open) { closeEditor(open); btn.classList.remove('on'); return; }
  document.querySelectorAll('.editor').forEach(closeEditor);
  document.querySelectorAll('.edit.on').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');

  const src = 'raw/nhk/' + file;
  const box = document.createElement('div');
  box.className = 'editor';
  box.innerHTML = `
    <div class="row">
      <input type="range" min="0" max="100" step="0.01" value="0">
      <span class="t">0:00.0</span>
    </div>
    <div class="row">
      <button class="before">◀ 여기까지 듣기</button>
      <button class="after">여기부터 듣기 ▶</button>
    </div>
    <div class="row">
      <button class="cut">✂ 여기서 자르기</button>
      <button class="undo">전부 합치기</button>
      <span class="note-sm cnt"></span>
    </div>
    <p class="tip"><b>끊고 싶은 글자를 누른다</b> — 그 지점으로 커서가 가고 바로 들린다.
      「여기까지」·「여기부터」로 양쪽을 들어보고, 어긋나면 슬라이더나 좌우 화살표로 맞춘 뒤 자른다.
      <span class="src-note"></span>
      음성 파일은 그대로다 — 끊는 위치만 기억한다.</p>`;
  cue.appendChild(box);
  cue.classList.add('editing');

  const range = box.querySelector('input');
  const label = box.querySelector('.t');
  const cnt = box.querySelector('.cnt');
  const showCnt = () => {
    const n = splitsOf(file).length;
    cnt.textContent = n ? `${n + 1}조각` : '아직 안 나눔';
  };
  showCnt();

  // 미리듣기 전용 오디오 — 본 재생기와 섞이면 서로 끊는다.
  const pre = new Audio(src);
  pre.preload = 'metadata';
  let previewStop = null;

  // ---- 글자 짚기 ----
  const jpEl = cue.querySelector('.jp');
  const { tokens, total } = tokenize(cue.dataset.jp || '');
  let env = null;               // 음량 포락선 (무음 구간 판정용)
  let pendingIdx = null;        // 글자로 지정했을 때 그 글자 번호 — 자를 때 같이 저장한다

  // 실측 시각이 있으면 그걸 쓴다. 없을 때만 모라 비례로 추정한다.
  const measured = NHK_TIMES && NHK_TIMES[file];

  // 정렬이 못 붙인 글자는 직전 시각을 그대로 물려받아 여러 글자가 같은 값을 공유한다.
  // 그 구간에서는 어느 글자를 눌러도 같은 자리가 잡히므로, 실측된 앞뒤 지점 사이를
  // 모라 비율로 갈라 메운다 — 실측을 기준점으로 삼고 그 사이만 추정하는 셈이다.
  const anchorAt = i => {
    if (!measured) return null;
    const t = measured[tokens[i].ci];
    return typeof t === 'number' ? t : null;
  };
  const buildFilled = () => {
    if (!measured) return null;
    const out = tokens.map((_, i) => anchorAt(i));
    // 앞뒤로 값이 달라지는 지점만 기준점으로 인정한다
    const isAnchor = out.map((t, i) => t !== null && (i === 0 || out[i - 1] === null || t !== out[i - 1]));

    // 기준점이 2개 미만이면 정렬이 사실상 실패한 문장이다. 같은 시각을 계속 돌려주면
    // 어느 글자를 눌러도 같은 자리가 잡히므로, 차라리 통째로 추정으로 돌아간다.
    if (isAnchor.filter(Boolean).length < 2) return null;

    // 기준점이 여러 개여도, 그것들이 음성의 앞부분에만 몰려 있으면 정렬이 도중에
    // 끊긴 것이다. 그대로 보간하면 뒤쪽 글자 수십 개가 짧은 구간에 뭉쳐 범위가
    // 통째로 어긋난다(실측: 6.6초 음성인데 마지막 글자가 2.0초).
    // 말이 있는 구간의 60% 미만만 덮으면 믿지 않는다 — 전체의 1.5%(24문장)가 여기 걸린다.
    if (env) {
      const anchors = out.filter((t, i) => isAnchor[i]);
      const span = env.speechEnd - env.speechStart;
      const covered = anchors[anchors.length - 1] - anchors[0];
      if (span > 0 && covered / span < 0.6) return null;
    }

    for (let i = 0; i < out.length; i++) {
      if (isAnchor[i]) continue;
      let p = i - 1; while (p >= 0 && !isAnchor[p]) p--;
      let n = i + 1; while (n < out.length && !isAnchor[n]) n++;
      // 뒤쪽 기준점이 없으면 물려받은 값이 그대로 남아 뭉친다 → 그 구간만 추정에 맡긴다.
      if (p < 0 || n >= out.length) { out[i] = null; continue; }
      const span = tokens[n].cum - tokens[p].cum;
      if (span <= 0) { out[i] = null; continue; }
      const ratio = (tokens[i].cum - tokens[p].cum) / span;
      out[i] = out[p] + (out[n] - out[p]) * ratio;
    }
    return out;
  };
  let filled = buildFilled();

  const timeAt = i => {
    const t = filled ? filled[i] : null;
    if (typeof t === 'number') return t;
    const a = env ? env.speechStart : 0;
    const b = env ? env.speechEnd : (pre.duration || 0);
    return a + (b - a) * (tokens[i].cum / total);
  };

  // 자를 자리를 소리에 맞춰 다듬는다.
  //
  // 정렬 시각은 단어 **앞의 쉼 안쪽**을 가리키는 경우가 많다(실측 0.2~0.3초 이르다).
  // 그 자리에서 자르면 앞 조각은 꼬리가 잘리고 뒤 조각은 앞 소리를 물고 시작한다.
  // 그래서 두 가지로 나눠 다듬는다:
  //   ① 지정 지점이 무음 안이면 → 말이 다시 시작되는 지점까지 앞으로 민다
  //   ② 이미 말 위면 → 앞쪽으로 치우친 좁은 창에서 가장 조용한 자리로
  // ②의 창을 뒤로 넓게 열지 않는 이유는, 넓히면 이전 단어의 쉼으로 끌려가 오히려
  // 더 앞에서 잘리기 때문이다(실측: 뒤로 최대 0.22초까지 밀렸다).
  const snap = (t) => {
    if (!env) return t;
    const { rms, hop } = env;
    const thr = env.peak * 0.06;
    let k = Math.min(rms.length - 1, Math.round(t / hop));
    if (rms[k] < thr) {
      const end = Math.min(rms.length - 1, Math.round((t + 0.45) / hop));
      while (k + 1 <= end && rms[k + 1] < thr) k += 1;
      return Math.min((k + 1) * hop, t + 0.45);
    }
    const lo = Math.max(0, Math.round((t - 0.06) / hop));
    const hi = Math.min(rms.length - 1, Math.round((t + 0.12) / hop));
    let best = t, low = Infinity;
    for (let j = lo; j <= hi; j++) if (rms[j] < low) { low = rms[j]; best = j * hop; }
    return best;
  };

  jpEl.querySelectorAll('.tok').forEach(el => {
    el.onclick = (e) => {
      if (!cue.classList.contains('editing')) return;
      e.stopPropagation();
      if (!pre.duration) return;
      const idx = +el.dataset.i;
      pendingIdx = idx;
      range.value = snap(timeAt(idx)).toFixed(2);
      jpEl.querySelectorAll('.tok.at').forEach(t => t.classList.remove('at'));
      el.classList.add('at');
      seekPreview();
    };
  });

  box.restoreJp = () => { cue.classList.remove('editing'); };

  // 지금 무엇을 근거로 위치를 잡는지 알려준다 — 어긋날 때 원인을 짐작할 수 있다.
  function updateSrcNote() {
    const el = box.querySelector('.src-note');
    if (el) el.textContent = filled
      ? '글자 위치는 음성에서 실측한 값이다.'
      : '이 문장은 정렬이 안 붙어 모라 수로 추정한다 — 어긋날 수 있다.';
  }
  updateSrcNote();

  pre.addEventListener('loadedmetadata', () => {
    range.max = pre.duration.toFixed(2);
    label.textContent = secs(0);
  });

  // 음량 포락선은 디코딩이 필요해 조금 늦게 온다. 오기 전에도 클릭은 되고(비례 추정),
  // 오고 나면 자동으로 정확해진다.
  analyzeAudio(src).then(e => {
    env = e;
    // 포락선이 와야 커버리지 판정을 할 수 있다 — 도착 시점에 다시 계산한다.
    filled = buildFilled();
    updateSrcNote();
  }).catch(() => {});

  const seekPreview = (manual) => {
    stopSeg();                       // 본 재생기가 돌고 있으면 멈춘다
    if (manual) pendingIdx = null;   // 손으로 옮겼으면 더는 그 글자 자리가 아니다
    const at = +range.value;
    label.textContent = secs(at);
    clearTimeout(previewStop);
    if (pre.readyState < 1) return;
    pre.currentTime = at;
    pre.play().catch(() => {});
    // 커서 주변만 짧게 들려준다 — 끝까지 흘러가면 자를 지점을 놓친다.
    previewStop = setTimeout(() => pre.pause(), 1200);
  };
  range.oninput = () => seekPreview(true);

  // 경계는 양쪽을 들어봐야 판단된다. 「여기까지」는 앞 조각의 끝이 어떻게 끊기는지,
  // 「여기부터」는 뒤 조각이 어떻게 시작하는지 들려준다.
  const playWindow = (from, to) => {
    clearTimeout(previewStop);
    stopSeg();
    if (pre.readyState < 1) return;
    pre.currentTime = Math.max(0, from);
    pre.play().catch(() => {});
    previewStop = setTimeout(() => pre.pause(), Math.max(150, (to - Math.max(0, from)) * 1000));
  };
  box.querySelector('.before').onclick = () => playWindow(+range.value - 1.0, +range.value);
  box.querySelector('.after').onclick = () => playWindow(+range.value, +range.value + 1.2);

  // 자른 뒤에도 패널은 열린 채로 둔다 — 보통 한 문장을 여러 번 나누기 때문.
  // 낡은 패널을 먼저 걷어내야 한다. 남겨두면 toggleEditor 가 "열려 있으니 닫자"로 판단한다.
  box.stopPreview = () => { clearTimeout(previewStop); pre.pause(); };

  const reopen = () => {
    const at = range.value;
    closeEditor(box);
    repaintSegs(cue, file);
    toggleEditor(cue, file, cue.querySelector('.edit'));
    const fresh = cue.querySelector('.editor input');
    if (fresh) {
      fresh.value = at;                                // 커서 위치는 유지
      // 시간 표시도 같이 되돌린다. 안 하면 슬라이더는 그 자리인데 0:00.0 으로 보인다.
      const lbl = cue.querySelector('.editor .t');
      if (lbl) lbl.textContent = secs(+at);
    }
  };

  box.querySelector('.cut').onclick = () => {
    clearTimeout(previewStop); pre.pause();
    if (!addSplit(file, +range.value, pendingIdx)) { toast('그 자리엔 이미 경계가 있다'); return; }
    reopen();
  };

  box.querySelector('.undo').onclick = () => {
    clearTimeout(previewStop); pre.pause();
    if (!clearSplits(file)) { toast('나눈 곳이 없다'); return; }
    reopen();
    toast('한 문장으로 되돌렸다');
  };
}

let vocabQuery = '';

function renderVocab() {

  const q = vocabQuery.trim();
  const hits = q ? all.filter(v =>
    v.w.includes(q) || (v.r || '').includes(q) || (v.s || '').includes(q) || (v.label || '').includes(q)) : all;

  app.innerHTML = `
    <input class="search" id="vocabQ" placeholder="단어·읽기·문장 검색" value="${esc(q)}">
    ${all.length ? `<p class="hint">${hits.length}개${q ? ` (전체 ${all.length})` : ''}.
      일본어 문장을 <b>드래그</b>하면 저장 버튼이 뜬다.</p>` : ''}
    ${hits.length ? `<div class="vocab">${hits.map(v => `
      <div class="word" data-key="${esc(v.key)}">
        <div class="hd"><span class="w">${ruby(v.wr || v.w)}</span>
          ${v.r ? `<span class="r">${esc(v.r)}</span>` : ''}</div>
        ${v.s ? `<p class="ctx">${highlightIn(v.s, v.w)}</p>` : ''}
        <div class="foot">

        </div>
      </div>`).join('')}</div>`
      : `<p class="empty">${all.length ? '검색 결과 없음.'
        : '아직 없다. 일본어 문장을 드래그하면 저장 버튼이 뜬다.'}</p>`}`;

  const input = document.getElementById('vocabQ');
  input.oninput = () => {
    vocabQuery = input.value;
    const at = input.selectionStart;
    renderVocab();
    const next = document.getElementById('vocabQ');
    next.focus(); next.setSelectionRange(at, at);
  };
  app.querySelectorAll('.word').forEach(card => {
    const key = card.dataset.key;
    card.querySelector('.del').onclick = () => { removeVocab(key); renderVocab(); updateCount('vocab'); };
    const go = card.querySelector('.go');
    if (go) go.onclick = () => { location.hash = (vocabMap[key].h || '').replace(/^#/, ''); };

}

/** 문장 안에서 저장한 표현만 굵게. 문장은 {漢字|かな} 마크업이라 표면형으로 찾아야 한다. */
function highlightIn(sentence, word) {
  const { tokens } = tokenize(sentence);
  const surface = tokens.map(t => t.text).join('');
  const at = surface.indexOf(word);
  if (at < 0) return ruby(sentence);
  let ci = 0;
  return tokens.map(t => {
    const inWord = ci >= at && ci < at + word.length;
    ci += t.text.length;
    const html = t.read ? `<ruby>${esc(t.text)}<rt>${esc(t.read)}</rt></ruby>` : esc(t.text);
    return inWord ? `<b>${html}</b>` : html;
  }).join('');
}

let hardQuery = '';

/** 유튜브 음성은 opus/m4a 중 브라우저가 읽을 수 있는 쪽을 골라야 한다. 한 번 고르면 캐시. */
const srcCache = new Map();
async function ytSrc(id) {
  if (srcCache.has(id)) return srcCache.get(id);
  const cands = [
    ['audio/ogg; codecs=opus', `raw/audio/${id}.opus`],
    ['audio/mp4; codecs=mp4a.40.2', `raw/audio/${id}.m4a`],
  ].filter(([t]) => audio.canPlayType(t) !== '').map(([, u]) => u);
  for (const c of cands) {
    const r = await fetch(c, { method: 'HEAD' }).catch(() => null);
    if (r && r.ok) { srcCache.set(id, c); return c; }
  }
  srcCache.set(id, '');
  return '';
}

function renderHard() {
  const all = hardList();

      안 잡히는 문장만 모아 다시 듣는 자리다.</p>` : ''}
    ${hits.length ? `<div class="vocab">${hits.map(v => `
      <div class="word hardcard" data-key="${esc(v.key)}">
        <div class="segs"><span class="seg" data-start="${v.start || 0}"${v.end != null ? ` data-end="${v.end}"` : ''}>
          <button class="pl" title="이 문장 듣기">▶</button></span></div>
        <p class="jp">${ruby(v.jp || '')}</p>
        <div class="foot">
          <span class="lbl">${esc(v.label || '')}</span>
          ${v.h ? '<button class="go">문장으로</button>' : ''}
          <button class="del">빼기</button>
        </div>
      </div>`).join('')}</div>`
      : `<p class="empty">${all.length ? '검색 결과 없음.'
        : '아직 없다. 문장 옆 ★ 를 누르면 여기 모인다.'}</p>`}`;

  const input = document.getElementById('hardQ');
  input.oninput = () => {

    const at = input.selectionStart;
    renderHard();
    const n = document.getElementById('hardQ'); n.focus(); n.setSelectionRange(at, at);
  };

  app.querySelectorAll('.hardcard').forEach(async (card) => {
    const v = hardMap[card.dataset.key];
    card.querySelector('.del').onclick = () => {
      hardMap[card.dataset.key] = { ...v, t: -Date.now() };
      saveHard(); renderHard(); updateCount('hard');
    };
    const go = card.querySelector('.go');
    if (go) go.onclick = () => { location.hash = (v.h || '').replace(/^#/, ''); };

    // 재생: 저장해둔 정보만으로 자족적으로 돌린다
    const seg = card.querySelector('.seg');
    const src = v.kind === 'nhk' ? 'raw/nhk/' + v.ref : await ytSrc(v.ref);
    if (!src) { seg.querySelector('.pl').remove(); return; }
    seg.dataset.src = src;
    seg.querySelector('.pl').onclick = () => playSeg(seg);
  });
}

// ---- 회화 노트 ----
// 로컬(calls.js 있음)은 평문을 바로 쓴다. 공개본은 잠금본(calls.enc.js)뿐이라 암호로 푼다.
// 풀린 결과는 메모리에만 둔다. 「이 기기에서 기억」을 켜면 암호를 localStorage 에 둬서
// 다음부터 자동으로 연다 — 폰에서 매번 치지 않게. 남과 같이 쓰는 기기에선 끄고 쓸 것.
let CALLS = typeof CALLS_DATA !== 'undefined' ? CALLS_DATA : null;
const CALLS_LOCKED = typeof CALLS_ENC !== 'undefined' ? CALLS_ENC : null;
const CALLS_PASS_KEY = 'callsPass';
const b64u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decryptCalls(blob, pass) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64u8(blob.salt), iterations: blob.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64u8(blob.iv) }, key, b64u8(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

// 문장 전체를 보여주되, 문제의 조각이 그 안에 있으면 표시한다(bad = 틀린 곳, good = 고친 곳).
// 둘 다 {漢字|かな} 마크업을 쓴 같은 문자열이라 그대로 찾으면 된다. 못 찾으면 표시 없이 문장만.
function hl(full, frag, cls) {
  const at = frag ? full.indexOf(frag) : -1;
  if (at < 0 || frag === full) return ruby(full);
  return ruby(full.slice(0, at)) + `<span class="${cls}">${ruby(frag)}</span>` + ruby(full.slice(at + frag.length));
}

// ---- 회화 노트 음성 (상대 대사 조각) ----
// 로컬: 조각 파일(calls/audio/…)을 바로 튼다. 공개본: 그 통화의 음성 잠금본을 받아 풀어서 튼다.
// 아이폰 사파리는 "누른 순간"에 play() 해야 소리를 낸다. 누른 뒤에 받고 풀면 그 순간이 지나가서
// 막힌다 — 그래서 상세 화면을 여는 즉시 미리 받아 풀어두고, 준비되면 버튼을 켠다.
let CALLS_PASS = null;          // 공개본에서 글을 푼 암호. 음성 잠금본도 같은 암호로 연다
const callClipUrls = {};         // `${통화id}/${clipKey}` → 재생 주소
// 조각마다 재생기를 따로 만들어 미리 읽어둔다. 재생기 하나에 누를 때마다 src 를 바꾸면
// 그때부터 파일을 읽고 해독해서 누른 뒤 한참 있다가 소리가 난다(특히 아이폰).
const callPlayers = {};          // 같은 키 → <audio>
let callPlaying = null;
const stopCallAudio = () => { if (callPlaying) { callPlaying.pause(); callPlaying = null; } };
addEventListener('hashchange', stopCallAudio);
function callPlayer(k) {
  if (!callPlayers[k]) {
    const a = new Audio();
    a.preload = 'auto';
    a.src = callClipUrls[k];
    a.load();
    callPlayers[k] = a;
  }
  return callPlayers[k];
}

async function prepareCallAudio(c) {
  // 📥 가져다 쓸 표현 + ✏️ 카드 속 「상대:」 줄
  const clips = [...c.steal, ...(c.missed || []), ...c.fixes.map(f => f.ctx).filter(Boolean)].filter(s => s.clipKey);
  if (!clips.length) return false;
  if (typeof CALLS_DATA !== 'undefined') {           // 로컬: 파일이 옆에 있다
    clips.forEach(s => { callClipUrls[`${c.id}/${s.clipKey}`] = s.clip; });
    return true;
  }
  if (clips.every(s => callClipUrls[`${c.id}/${s.clipKey}`])) return true;
  const blob = await (await fetch(`calls-audio/${c.id}.enc.json`, { cache: 'no-store' })).json();
  const map = await decryptCalls(blob, CALLS_PASS);
  for (const [key, b] of Object.entries(map)) {
    callClipUrls[`${c.id}/${key}`] = URL.createObjectURL(new Blob([b64u8(b)], { type: 'audio/mp4' }));
  }
  return true;
}

// data-clip 이 붙은 것(▶ 버튼, 일본어 문장)을 누르면 그 조각을 튼다. 재생 중인 카드는 테두리로 표시.
function wireCallClips(c, root = app) {
  const els = root.querySelectorAll('[data-clip]');
  if (!els.length) return;
  const play = (el) => {
    const k = `${c.id}/${el.dataset.clip}`;
    if (!callClipUrls[k]) return;
    const card = el.closest('.fix');
    stopCallAudio();
    app.querySelectorAll('.fix.playing').forEach(x => x.classList.remove('playing'));
    card?.classList.add('playing');
    const a = callPlayer(k);
    a.currentTime = 0;
    callPlaying = a;
    a.play().catch(() => card?.classList.remove('playing'));
    a.onended = () => card?.classList.remove('playing');
  };
  prepareCallAudio(c).then(ok => {
    if (!ok) return;
    // 화면에 있는 조각들을 미리 읽어둔다 — 누르는 순간 바로 나오게
    new Set([...els].map(el => `${c.id}/${el.dataset.clip}`)).forEach(k => callClipUrls[k] && callPlayer(k));
    els.forEach(el => {
      el.classList.add('playable');
      if (el.matches('.clip-btn')) el.disabled = false;
      el.onclick = (e) => { e.stopPropagation(); play(el); };
    });
  }).catch(() => {
    root.querySelectorAll('.clip-btn').forEach(b => { b.textContent = '음성 못 불러옴'; });
  });
}

  app.innerHTML = `

      <p>실제 통화에서 나온 문장이라 잠가뒀다.</p>
      <input type="password" id="callsPass" autocomplete="off" autofocus>
      <label><input type="checkbox" id="callsRemember" checked> 이 기기에서 기억</label>
      <button id="callsOpen">열기</button>
      <p class="err" id="callsErr"></p>
    </div>`;
  const input = document.getElementById('callsPass');
  const err = document.getElementById('callsErr');
  const open = async () => {
    err.textContent = '여는 중…';
    try {
      CALLS = await decryptCalls(CALLS_LOCKED, input.value);
      CALLS_PASS = input.value;
      if (document.getElementById('callsRemember').checked) localStorage.setItem(CALLS_PASS_KEY, input.value);
      route();
    } catch {
      err.textContent = '암호가 다르다.';
      input.select();
    }
  };
  document.getElementById('callsOpen').onclick = open;
  input.onkeydown = e => { if (e.key === 'Enter') open(); };
}

const PART_ICON = { ok: '✅', meh: '🔸', bad: '❌' };   // 맞음 · 뜻은 통하지만 어색 · 틀림(뜻이 바뀌거나 문법 오류)
// ✏️·🧱 카드: 실제로 한 말을 조각마다 판정한 목록. 맞은 조각도 보여 줘야 "어디까지 맞았는지"가 보인다.
const partsList = parts => parts && parts.length ? `
          <p class="lbl">어디가 맞고 어디가 틀렸나</p>
          <ul class="parts">${parts.map(p => `<li class="p-${esc(p.v)}"><span class="pv">${PART_ICON[p.v] || ''}</span><span class="jp">${ruby(p.jp)}</span><span class="pw">${esc(p.why)}</span></li>`).join('')}</ul>` : '';

// ---- 회화 노트 카드 ----
// 카드 id = `${통화id}:${칸}:${원래 배열 순번}`. 화면은 시각순으로 정렬해 그리지만 데이터 파일의 순서는
// 그대로라 순번이 흔들리지 않는다. ✓(callsItem)와 ★(callsStar)는 같은 id 로 완료 저장소에 들어가서
// 기기 간 동기화도 기존 완료 표시와 같이 된다.
const CALL_SECS = [   // [칸, 데이터 키, 제목]
  ['fix', 'fixes', '✏️ 고칠 표현'], ['stuck', 'stuck', '🧱 막힌 순간'], ['missed', 'missed', '👂 못 알아들은 순간'],
  ['steal', 'steal', '📥 가져다 쓸 표현'], ['good', 'good', '👍 잘한 점'], ['vocab', 'vocab', '📖 새 단어'],
];
const callArr = (c, sec) => c[CALL_SECS.find(([s]) => s === sec)[1]] || [];
const callItemId = (c, sec, it) => `${c.id}:${sec}:${callArr(c, sec).indexOf(it)}`;
const isStar = id => isDone('callsStar', id);
const callStars = c => CALL_SECS.flatMap(([sec]) => callArr(c, sec).filter(it => isStar(callItemId(c, sec, it))));
const callStarTotal = () => (CALLS || []).reduce((n, c) => n + callStars(c).length, 0);
const byT = (a, b) => ((a.t || '') < (b.t || '') ? -1 : 1);
const FILT = [['todo', '안 한 것'], ['done', '확인한 것'], ['all', '전체']];

const starBtn = id => `<button class="star${isStar(id) ? ' on' : ''}" data-star-id="${esc(id)}" title="별표 — ⭐ 칸에 모인다">★</button>`;
const cardTools = (c, sec, it) => { const id = callItemId(c, sec, it); return `<span class="tools">${starBtn(id)}${checkBtn('callsItem', id)}</span>`; };
const cardCls = (c, sec, it) => (isDone('callsItem', callItemId(c, sec, it)) ? ' done' : '');
const keysHtml = ks => ks && ks.length
  ? `<div class="keys">${ks.map(k => `<span class="key"><b class="jp">${ruby(k.jp)}</b> ${esc(k.kr || '')}</span>`).join('')}</div>` : '';

const CARD = {
  fix: (c, f) => `
        <div class="fix${cardCls(c, 'fix', f)}">
          <div class="fix-top"><span class="tsx">${esc(f.t)}</span><span class="tag">${esc(f.cat)}</span>

          <p class="lbl">내가 한 말</p>
          <p class="jp said-full peek">${hl(f.said_full || f.said, f.said, 'bad')}</p>
          ${partsList(f.parts)}

  stuck: (c, s) => `
        <div class="fix${cardCls(c, 'stuck', s)}">
          <div class="fix-top"><span class="tsx">${esc(s.t)}</span><span class="tag">${esc(s.signal || '')}</span>
            ${cardTools(c, 'stuck', s)}</div>
          ${s.ctx ? `<p class="ctx">상대: <span class="jp">${ruby(s.ctx.jp)}</span><span class="ctx-kr">${esc(s.ctx.kr || '')}</span></p>` : ''}
          <p class="lbl">하려던 말</p>
          <p class="wanted">${esc(s.wanted || '')}</p>
          <p class="lbl">실제로 한 말</p>
          <p class="jp said-full peek">${ruby(s.said_full || '')}</p>

  missed: (c, m) => `
        <div class="fix${cardCls(c, 'missed', m)}">
          <div class="fix-top"><span class="tsx">${esc(m.t)}</span><span class="tag">${esc(m.cause || '')}</span>
            ${m.clipKey ? `<button class="clip-btn" data-clip="${esc(m.clipKey)}" disabled>▶ 듣기</button>` : ''}
            ${cardTools(c, 'missed', m)}</div>
          <p class="jp nat peek"${m.clipKey ? ` data-clip="${esc(m.clipKey)}"` : ''}>${ruby(m.jp_full || '')}</p>
          <p class="kr">${esc(m.kr || '')}</p>
          ${keysHtml(m.key)}
          ${m.how ? `<p class="why">${esc(m.how)}</p>` : ''}
        </div>`,
  steal: (c, s) => `
        <div class="fix${cardCls(c, 'steal', s)}">
          <div class="fix-top"><span class="tsx">${esc(s.t)}</span>
            ${s.clipKey ? `<button class="clip-btn" data-clip="${esc(s.clipKey)}" disabled>▶ 듣기</button>` : ''}
            ${cardTools(c, 'steal', s)}</div>
          <p class="jp nat peek"${s.clipKey ? ` data-clip="${esc(s.clipKey)}"` : ''}>${hl(s.jp_full || s.jp, s.jp, 'good')}</p>
          <p class="kr">${esc(s.kr)}</p>
          ${s.note ? `<p class="why">${esc(s.note)}</p>` : ''}

          <p class="why">${esc(g.why)}</p>
        </div>`,
  vocab: (c, v) => `
        <div class="fix vocabcard${cardCls(c, 'vocab', v)}">
          <div class="fix-top"><b class="jp">${ruby(v.jp)}</b>${cardTools(c, 'vocab', v)}</div>
          <p class="mn peek">${esc(v.kr)}</p>
          <p class="why">${v.t ? esc(v.t) + ' · ' : ''}${esc(v.context || '')}</p>
