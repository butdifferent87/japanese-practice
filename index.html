// ★ 누르기. 별표 칸 안에서 해제해도 카드는 그 자리에 두고(누르자마자 사라지면 되돌리기 어렵다) 표시만 끈다.
function wireStars(root, onChange) {
  root.querySelectorAll('.star').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const id = btn.dataset.starId, next = !isStar(id);
      setDone('callsStar', id, next);
      // 같은 카드가 다른 칸(별표 칸 ↔ 원래 칸)에도 그려져 있으면 같이 켠다
      app.querySelectorAll(`.star[data-star-id="${CSS.escape(id)}"]`).forEach(b => b.classList.toggle('on', next));
      onChange && onChange();
    };
  });
}
// ✓ 도 같은 카드가 두 곳에 있을 수 있어 둘 다 맞춘다(wireChecks 는 누른 카드만 바꾼다).
function syncChecks(root) {
  root.querySelectorAll('.chk[data-kind="callsItem"]').forEach(b => {
    const on = isDone('callsItem', b.dataset.doneId);
    b.classList.toggle('on', on);
    b.closest('.fix')?.classList.toggle('done', on);
  });
}

// 별표한 카드를 칸별로 묶어 그린다.
function starCardsHtml(c) {
  const groups = CALL_SECS.map(([sec, , title]) => {
    const its = callArr(c, sec).filter(it => isStar(callItemId(c, sec, it))).sort(byT);
    return its.length ? `<p class="star-grp">${title} ${its.length}</p>${its.map(it => CARD[sec](c, it)).join('')}` : '';
  }).join('');
  return groups;
}
const wireKr = root => root.querySelectorAll('.kr').forEach(p => p.onclick = () => p.classList.toggle('reveal'));

function renderCallDetail(c) {
  const seen = sec => callArr(c, sec).filter(it => isDone('callsItem', callItemId(c, sec, it))).length;
  const secLabel = {
    fix: () => `✏️ 고칠 표현 ${seen('fix')}/${c.fixes.length}`,
    stuck: () => `🧱 막힌 순간 ${seen('stuck')}/${callArr(c, 'stuck').length}`,
    missed: () => `👂 못 알아들은 순간 ${seen('missed')}/${callArr(c, 'missed').length}`,
    steal: () => `📥 가져다 쓸 표현 ${seen('steal')}/${c.steal.length}`,
    good: () => `👍 잘한 점 ${seen('good')}/${c.good.length}`,
    vocab: () => `📖 새 단어 ${seen('vocab')}/${c.vocab.length}`,
    star: () => `⭐ 별표 ${callStars(c).length}`,
  };
  const secs = [
    ['sec-star', secLabel.star()],
    ['sec-fix', secLabel.fix()],
    ...(callArr(c, 'stuck').length ? [['sec-stuck', secLabel.stuck()]] : []),
    ...(callArr(c, 'missed').length ? [['sec-missed', secLabel.missed()]] : []),
    ['sec-steal', secLabel.steal()],
    ['sec-good', secLabel.good()],
    ['sec-vocab', secLabel.vocab()],
    ['sec-stats', '📊 말버릇'],
  ];
  const list = sec => [...callArr(c, sec)].sort(byT).map(it => CARD[sec](c, it)).join('');
  app.innerHTML = `
    <button class="back">← 회화 목록</button>
    <div class="detail">
      <h2>${esc(c.title)}</h2>
      <div class="meta"><span>${esc(c.date)}</span><span>${esc(c.duration)}</span><span>${esc(c.with || '')}</span></div>
      <div class="filt">${FILT.map(([k]) => `<button data-filt="${k}"></button>`).join('')}</div>
      <div class="jump">${secs.map(([id, label]) => `<button data-go="${id}">${label}</button>`).join('')}</div>

      <h3 class="call-sec" id="sec-star">⭐ 별표</h3>
      <div class="star-body"></div>

      <h3 class="call-sec">🔁 반복되는 실수</h3>
      <ul class="patterns">${c.patterns.map(p => `<li>${esc(p)}</li>`).join('')}</ul>

      <h3 class="call-sec" id="sec-fix">✏️ 고칠 표현</h3>
      <p class="hint">줄 친 쪽이 실제로 한 말, 굵은 쪽이 자연스러운 표현. 시각은 녹음 속 위치. ★를 누르면 ⭐ 칸에 모인다.</p>
      ${list('fix')}

      ${callArr(c, 'stuck').length ? `
      <h3 class="call-sec" id="sec-stuck">🧱 막힌 순간</h3>
      <p class="hint">말하려다 막힌 곳. 실제로 한 말은 조각마다 ✅ 맞음 · 🔸 통하지만 어색 · ❌ 틀림으로 나눴다. 그때 떠올리지 못한 말이 아래 칩에 있다.</p>
      ${list('stuck')}` : ''}

      ${callArr(c, 'missed').length ? `
      <h3 class="call-sec" id="sec-missed">👂 못 알아들은 순간</h3>
      <p class="hint">상대 말을 놓친 곳. 「번역 가리기」를 켜고 ▶로 먼저 들어본 뒤 뜻을 확인해보자.</p>
      ${list('missed')}` : ''}

      <h3 class="call-sec" id="sec-steal">📥 가져다 쓸 표현</h3>
      <p class="hint">상대가 쓴 자연스러운 표현. 「번역 가리기」를 켜면 뜻을 가리고 떠올려볼 수 있다.</p>
      ${list('steal')}

      <h3 class="call-sec" id="sec-good">👍 잘한 점</h3>
      ${list('good')}

      <h3 class="call-sec" id="sec-vocab">📖 새 단어</h3>
      ${callArr(c, 'vocab').map(v => CARD.vocab(c, v)).join('')}

      <h3 class="call-sec" id="sec-stats">📊 말버릇 (통화 전체)</h3>
      <div class="stats">${(c.stats || []).map(s => `
        <div class="stat"><b>${esc(s.label)}</b>${esc(s.value)}${s.note ? `<br><small>${esc(s.note)}</small>` : ''}</div>`).join('')}
      </div>
      ${doneBar('calls', c.id, '이 회화 복습 완료로 표시')}
    </div>`;

  // 카드 체크·별표 → 위쪽 칩의 「n/전체」「⭐ n」을 바로 갱신
  const relabel = () => {
    for (const sec of Object.keys(secLabel)) {
      const b = app.querySelector(`[data-go="sec-${sec}"]`);
      if (b) b.textContent = secLabel[sec]();
    }
  };
  const wireCards = root => {
    wireChecks(root, () => { syncChecks(app); relabel(); refreshFilter(); });
    wireStars(root, relabel);
    wireKr(root);
  };
  wireCards(app);
  wireDoneBar('calls', c.id, '이 회화 복습 완료로 표시');
  wireCallClips(c);
  app.querySelector('.back').onclick = () => { location.hash = 'calls'; };
  // ---- 칩 = 탭 ----
  // 칩을 누르면 스크롤로 이동하지 않고 그 칸만 보여준다(유저: "스크롤이 느려서 답답"). 칸 나누기는 그린 뒤에
  // DOM 으로 한다 — 제목(h3.call-sec[id])마다 새 칸, 그 앞의 🔁 반복 실수는 ✏️ 칸에 붙인다.
  const detail = app.querySelector('.detail');
  const jump = detail.querySelector('.jump');
  const panels = {};
  let cur = 'sec-fix';
  for (const el of [...detail.children]) {
    if (el === jump || el.matches('h2, .meta, .donebar, .filt')) continue;   // 필터는 모든 칸에 걸리니 칸 밖에
    if (el.matches('h3.call-sec[id]')) cur = el.id;
    else if (el.matches('h3.call-sec') && cur === 'sec-star') cur = 'sec-fix';   // 🔁 반복 실수는 ✏️ 칸 머리에
    if (!panels[cur]) { panels[cur] = document.createElement('section'); panels[cur].className = 'call-panel'; }
    panels[cur].append(el);
  }
  const order = secs.map(([id]) => id).filter(id => panels[id]);
  let anchor = jump;
  for (const id of order) { anchor.after(panels[id]); anchor = panels[id]; }
  const bar = detail.querySelector('.donebar');
  if (bar) anchor.after(bar);
  // 칩 줄은 헤더 바로 아래에 붙어 있게(스크롤해도 칩을 누를 수 있게)
  jump.style.top = document.querySelector('header').offsetHeight + 'px';
  // ⭐ 칸은 열 때마다 새로 그린다 — 다른 칸에서 방금 누른 별표까지 반영되게
  const drawStars = () => {
    const body = panels['sec-star'].querySelector('.star-body');
    body.innerHTML = starCardsHtml(c) || '<p class="empty">아직 별표한 카드가 없다. 카드 오른쪽 위 ★를 누르면 여기로 모인다.</p>';
    wireCards(body);
    wireCallClips(c, body);
  };
  const showTab = (id) => {
    if (id === 'sec-star') drawStars();
    for (const [k, p] of Object.entries(panels)) p.hidden = k !== id;
    refreshFilter();
    jump.querySelectorAll('[data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === id));
    localStorage.setItem('callsTab', id);
    // 칩 줄 아래로 내려가 있었다면 칸의 맨 위가 보이게 즉시 올린다
    const top = jump.getBoundingClientRect().top + scrollY - parseFloat(jump.style.top);
    if (scrollY > top) scrollTo(0, top);
  };
  jump.querySelectorAll('[data-go]').forEach(b => b.onclick = () => showTab(b.dataset.go));

  // ---- 안 한 것 / 확인한 것 / 전체 ----
  // 유저: "체크한 것도 계속 펼쳐져 있어서 뒤에 것 보기가 어렵다". 기본은 「안 한 것」 — 체크하면 그 자리에서 빠진다.
  // 전체·확인한 것에서도 체크한 카드는 한 줄로 접히고, 누르면 펼쳐진다.
  const filt = detail.querySelector('.filt');
  const cardSecs = CALL_SECS.map(([s]) => s);
  const doneN = () => cardSecs.reduce((n, sec) => n + seen(sec), 0);
  const allN = cardSecs.reduce((n, sec) => n + callArr(c, sec).length, 0);
  function refreshFilter() {
    const mode = localStorage.getItem('callsFilter') || 'todo';
    FILT.forEach(([k]) => detail.classList.toggle('f-' + k, k === mode));
    const d = doneN();
    const n = { todo: allN - d, done: d, all: allN };
    filt.querySelectorAll('[data-filt]').forEach(b => {
      b.classList.toggle('on', b.dataset.filt === mode);
      b.textContent = `${FILT.find(([k]) => k === b.dataset.filt)[1]} ${n[b.dataset.filt]}`;
    });
    // 걸러서 빈 칸이면 한마디 남긴다
    for (const p of Object.values(panels)) {
      const cards = [...p.querySelectorAll('.fix')];
      let msg = p.querySelector('.filt-empty');
      const shown = cards.filter(x => mode === 'all' || (mode === 'done') === x.classList.contains('done')).length;
      const text = cards.length && !shown ? (mode === 'todo' ? '이 칸은 다 확인했다 👏  「확인한 것」에서 다시 볼 수 있다.' : '이 칸에서 확인한 카드가 아직 없다.') : '';
      if (text && !msg) { msg = document.createElement('p'); msg.className = 'empty filt-empty'; p.append(msg); }
      if (msg) { msg.textContent = text; msg.hidden = !text; }
    }
  }
  filt.querySelectorAll('[data-filt]').forEach(b => b.onclick = () => {
    localStorage.setItem('callsFilter', b.dataset.filt); refreshFilter();
  });
  // 접힌(확인한) 카드를 누르면 펼치기/접기. 버튼·음성·번역 누르기는 그대로 둔다.
  detail.addEventListener('click', e => {
    if (e.target.closest('button, [data-clip], .kr, a')) return;
    e.target.closest('.fix.done')?.classList.toggle('open');
  });
  const saved = localStorage.getItem('callsTab');
  showTab(panels[saved] ? saved : 'sec-fix');
}

// ⭐ 별표 모음 — 모든 통화에서 별표한 카드를 통화별로 모아 본다.

// ---- 드래그해서 저장 ----
const savePop = document.getElementById('savePop');
let pendingSel = null;

function hideSavePop() { savePop.hidden = true; pendingSel = null; }

/** 선택 위쪽에 띄우되, 자리가 없으면 아래로 넘긴다. 화면 밖으로 나가지 않게 가둔다. */
function placeSavePop() {
  if (!pendingSel) return;
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) { hideSavePop(); return; }
  const r = sel.getRangeAt(0).getBoundingClientRect();
  if (!r.width && !r.height) return;

  savePop.hidden = false;                       // 크기를 재려면 먼저 보여야 한다
  const w = savePop.offsetWidth, h = savePop.offsetHeight;
  const gap = 8;
  const above = r.top - gap - h;
  let top = above >= 4 ? above : r.bottom + gap;
  // 선택이 화면 밖으로 밀려도 버튼은 화면 안에 남아야 누를 수 있다. 위아래 모두 가둔다.
  top = Math.min(Math.max(top, 4), innerHeight - h - 4);
  const left = Math.min(Math.max(r.left + r.width / 2, w / 2 + 8), innerWidth - w / 2 - 8);
  savePop.style.left = left + 'px';
  savePop.style.top = top + 'px';
}

document.addEventListener('selectionchange', () => {
  // 선택이 확정되는 순간을 잡기 어려워, 바뀔 때마다 보고 유효하면 버튼을 띄운다.
  const info = selectionInfo();
  if (!info) { hideSavePop(); return; }
  pendingSel = info;
  placeSavePop();
});

// 스크롤할 때 숨기면 안 된다 — 버튼이 화면 밖에 있어 스크롤해서 다가가는 경우가 있고,
// 그러면 맨 아래 문장은 영영 저장할 수 없다. 숨기는 대신 따라다니게 한다.
let popTick = 0;
// capture 로 받는다 — 스크롤이 내부 요소에서 나면 window 까지 올라오지 않는다.
addEventListener('scroll', () => {
  if (savePop.hidden || popTick) return;
  popTick = requestAnimationFrame(() => { popTick = 0; placeSavePop(); });
}, { passive: true, capture: true });
addEventListener('resize', placeSavePop);

// 버튼을 누르는 순간 브라우저가 텍스트 선택을 푼다 → selectionchange 가 떠서 버튼이
// 스스로 사라지고 클릭이 무산된다. mousedown 을 막아 선택을 유지한다.
// (스크립트로 click() 하면 mousedown 이 없어 이 문제가 안 드러난다 — 그래서 자동
//  테스트만으로는 못 잡았다.)
savePop.addEventListener('mousedown', (e) => e.preventDefault());
savePop.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

savePop.onclick = () => {
  if (!pendingSel) return;
  const cue = pendingSel.jp.closest('.cue');
  const entry = {
    w: pendingSel.w,
    r: pendingSel.r,
    s: cue?.dataset.jp || '',
    h: location.hash || '#',
    label: currentLabel(),
  };
  const added = addVocab(entry);
  toast(added ? `저장: ${entry.w}` : '이미 단어장에 있다');
  getSelection().removeAllRanges();
  hideSavePop();
  if (cornerBtns.vocab.classList.contains('on')) renderVocab();
  updateCount(cornerBtns.nhk.classList.contains('on') ? 'nhk'
    : cornerBtns.vocab.classList.contains('on') ? 'vocab' : 'yt');
};

/** 지금 보고 있는 자료의 이름 — 단어장에서 어디서 나온 표현인지 알려면 필요하다. */
function currentLabel() {
  const h = location.hash.slice(1);
  if (h.startsWith('nhk/')) return NHK[+h.slice(4)]?.group || 'NHK';
  const v = VIDEOS.find(x => x.id === h);
  return v ? v.title : '';

// 완료 표시는 **주소마다** 따로 쌓인다(브라우저가 origin 단위로 저장하기 때문).
// 같은 맥·같은 서버라도 localhost 와 xxx.local 은 서로의 진도를 모른다.
// 조용히 갈리면 알아채기 어려우니, 기준 주소가 아닐 때 한 번 알려준다.
// 같은 포트에 다른 서버가 함께 붙으면 요청이 번갈아 배분돼, 같은 주소가 어떨 땐
// 다른 사이트로 열린다. 조용히 헷갈리는 대신 눈에 보이게 알린다.
async function warnIfPortShared() {
  if (location.protocol === 'https:') return;      // 공개본은 해당 없음
  try {
    const r = await fetch(location.pathname + '?ping=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
    if (r.headers.get('X-App') !== 'japanese-practice') {
      toast('이 주소에 다른 서버가 같이 붙어 있다 — 터미널에서 lsof -ti:8899 확인');
    }
  } catch { /* 서버가 죽었으면 어차피 화면이 안 뜬다 */ }
}

function warnIfSplitStorage() {
  // 127.0.0.1 은 localhost 와 같은 서버지만 브라우저는 다른 사이트로 취급한다.
  // 진도가 따로 쌓이므로 여기도 경고 대상이다 — 정상 주소는 localhost 하나뿐.
  const CANON = ['localhost'];
  // 8897 은 검증 전용 주소다. 유저가 여기서 공부하면 진도가 따로 쌓이므로 분명히 알린다.
  if (location.port === '8897') {
    setTimeout(() => toast('여기는 검증용 주소다 — 공부는 localhost:8899 에서'), 600);
  }
  const isLocalServer = location.port === '8899';
  if (!isLocalServer || CANON.includes(location.hostname)) return;
  if (sessionStorage.getItem('originWarned')) return;
  sessionStorage.setItem('originWarned', '1');
  toast('이 주소는 진도가 따로 쌓인다 — 맥에서는 localhost:8899 로 볼 것');
}

// 링크로 받은 경우: 열자마자 합치고 해시는 지운다(새로고침 때 또 적용되지 않게).
async function consumeSyncHash() {
  const h = location.hash.slice(1);
  if (!h.startsWith('sync=')) return false;
  try {
    const n = mergeState(await decodeState(h.slice(5)));
    history.replaceState(null, '', location.pathname + location.search);
    route();   // replaceState 는 hashchange 를 안 쏜다 — 직접 다시 그린다
    toast(n ? `동기화 완료 — ${n}개 반영됨` : '동기화 완료 — 이미 최신');
  } catch {
    history.replaceState(null, '', location.pathname + location.search);
    route();   // replaceState 는 hashchange 를 안 쏜다 — 직접 다시 그린다
    toast('동기화 코드를 읽을 수 없다');
  }
  return true;
}

// "2:25" → 145
function hms(d) {
  const p = String(d).split(':').map(Number);
  return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1];
}

let booted = false;

function route() {
  const h = location.hash.slice(1);
  seqStop();                       // 코너를 옮기면 재생 중인 음성은 끊는다

  // 처음 열 때만, 마지막에 보던 코너로 돌려준다. 주소에 해시가 있으면 그쪽이 우선이고,
  // 「유튜브 노트」를 눌러 해시를 비운 경우와 구별하려고 첫 진입에서만 적용한다.
  if (!booted) {
    booted = true;
    if (!h) {
      const last = localStorage.getItem('corner');
      if (last === 'nhk' && NHK.length) { location.hash = 'nhk'; return; }
      if (last === 'calls' && (CALLS || CALLS_LOCKED)) { location.hash = 'calls'; return; }
      if (last === 'hard' || last === 'vocab') { location.hash = last; return; }
    }
  }

  // 동기화 링크로 들어온 경우. 해시를 지우고 나면 hashchange 가 다시 route 를 부른다.
  if (h.startsWith('sync=')) { consumeSyncHash(); return; }

  // 연결 키를 링크로 받는 경로. 폰에서 QR 한 번 찍으면 설정이 끝난다.
  if (h.startsWith('key=')) {
    const k = decodeURIComponent(h.slice(4));
    history.replaceState(null, '', location.pathname + location.search);
    if (k.length >= 24) {
      localStorage.setItem(SYNC_KEY_NAME, k);
      pullCloud(false).then(n => toast(n ? `연결됨 — ${n}개 받아왔다` : '연결됨'));
    } else {
      toast('연결 키가 짧다 — 다시 받아라');
    }
    route();
    return;
  }

  if (h === 'vocab') { setCorner('vocab'); renderVocab(); scrollTo(0, 0); return; }
  if (h === 'hard') { setCorner('hard'); renderHard(); scrollTo(0, 0); return; }

  // 회화 노트. 데이터가 아예 없는 빌드면 없는 코너처럼 군다.
  if (h === 'calls' || h.startsWith('calls/')) {
    if (!CALLS && !CALLS_LOCKED) { location.hash = ''; return; }
    setCorner('calls');
    if (!CALLS) { renderCallsLock(); scrollTo(0, 0); return; }
    if (h === 'calls/star') { renderCallsStar(); scrollTo(0, 0); return; }
    const c = h.startsWith('calls/') ? CALLS.find(x => x.id === h.slice(6)) : null;
    c ? renderCallDetail(c) : renderCallsList();
    scrollTo(0, 0);
    return;
  }

  // NHK 데이터가 없는 빌드(=공개본)에서는 그 코너가 존재하지 않는 것처럼 군다.
  // 빈 목록과 교재 안내문을 공개 페이지에 남길 이유가 없다.
  if ((h === 'nhk' || h.startsWith('nhk/')) && NHK.length) {
    setCorner('nhk');
    const i = h.startsWith('nhk/') ? Number(h.slice(4)) : NaN;
    NHK[i] ? renderNhkDetail(NHK[i], i) : renderNhkList();
  } else {
    setCorner('yt');
    const v = VIDEOS.find(x => x.id === h);
    v ? renderDetail(v) : renderList();
  }
  scrollTo(0, 0);
}
addEventListener('hashchange', route);

// 탭을 여러 개 열어두면 각자 메모리에 사본을 들고 있다. 다른 탭이 저장하면 이 이벤트가
// 오므로 그때 메모리를 다시 읽고 화면을 맞춘다. 안 그러면 옛 내용을 들고 있다가 덮어쓴다.
addEventListener('storage', (e) => {
  if (!e.key || e.key.endsWith('.bak')) return;      // 사본 쓰기는 같은 내용이라 무시
  if (e.key === DONE_KEY) doneMap = loadStore(DONE_KEY);
  else if (e.key === VOCAB_KEY) vocabMap = loadStore(VOCAB_KEY);
  else if (e.key === SPLIT_KEY) splitMap = loadStore(SPLIT_KEY);
  else if (e.key === HARD_KEY) hardMap = loadStore(HARD_KEY);
  else return;
  if (curCue || seq.on) return;                      // 듣는 중엔 다시 그리지 않는다
  route();
});

route();
warnIfSplitStorage();
warnIfPortShared();

// 시작할 때 한 번, 그리고 다른 기기에서 만진 걸 받으려고 창으로 돌아올 때마다.
if (syncKey()) {
  pullCloud(false);
  addEventListener('focus', () => pullCloud(false));
}

// 이 기기에서 기억해둔 회화 노트 암호가 있으면 조용히 푼다. 틀리면(암호를 바꾼 경우) 잊는다.
if (!CALLS && CALLS_LOCKED && localStorage.getItem(CALLS_PASS_KEY)) {
  decryptCalls(CALLS_LOCKED, localStorage.getItem(CALLS_PASS_KEY)).then(d => {
    CALLS = d;
    CALLS_PASS = localStorage.getItem(CALLS_PASS_KEY);
    if (location.hash.startsWith('#calls')) route(); else updateCount(localStorage.getItem('corner') || 'yt');
  }).catch(() => localStorage.removeItem(CALLS_PASS_KEY));
}

// 캐시된 교재 데이터를 쓰고 있었다면 조용히 최신으로 갈아끼운다.
if (NHK.length) {
  reloadNhk().then(fresh => {
    if (!fresh.length || JSON.stringify(fresh) === JSON.stringify(NHK)) return;
    NHK = fresh;
    updateCount(cornerBtns.nhk.classList.contains('on') ? 'nhk' : 'yt');
    // 다시 그리면 재생이 끊긴다. 듣고 있는 중이면 데이터만 갈아두고 화면은 그대로 둔다
    // — 다음에 이동할 때 새 데이터로 그려진다.
    if (!curCue && !seq.on) route();
  }).catch(() => {});
}
</script>
</body>
